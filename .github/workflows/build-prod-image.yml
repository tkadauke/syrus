name: Build production image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/tkadauke/syrus:full
            ghcr.io/tkadauke/syrus:full-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/tkadauke/syrus:cache
          cache-to: type=registry,ref=ghcr.io/tkadauke/syrus:cache,mode=max
