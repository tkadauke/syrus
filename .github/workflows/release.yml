# One manual, atomic release for everything Syrus ships: the CLI, the macOS
# and Windows desktop apps, and the backend Docker image. See docs/releasing.md
# for the runbook and docs/release-troubleshooting.md when a run goes red.
#
# The shape (and the why behind it):
#
# - MANUALLY triggered (workflow_dispatch). You pick the bump — the pipeline
#   computes the version, so there is no "tag first, hope it matches" dance.
#   `major` requires choosing it explicitly; `minor` is the default.
#
# - ATOMIC. Nothing is user-visible until the very end. The build jobs
#   (image, cli, mac, windows) each produce STAGED artifacts and push only a
#   *versioned* backend image tag — never `:latest`. Only the final `publish`
#   job creates the git tag, the GitHub Release, moves the image `:latest`
#   pointer, and (stub) kicks the website. If any build fails, `publish` never
#   runs: no release, no moved `:latest`, no half-shipped state.
#
# - dry_run does a FULL rehearsal — image built + integration-tested, apps
#   SIGNED + notarized / Azure-signed, cli cross-compiled — and stages every
#   artifact for inspection, but publishes nothing (no tag, no release, no
#   image push, no :latest move). dry_run gates only PUBLISH; the build jobs
#   are identical to a real release, so signing (the fragile part) is
#   validated every rehearsal. This is why there's no separate signing-test
#   workflow.
#
# - Signing is REQUIRED (dry or real): an unsigned macOS build is
#   Gatekeeper-blocked and breaks Squirrel.Mac auto-update; an unsigned Windows
#   build never ships. Credential PREFLIGHTS fail in seconds so a bad secret
#   does not waste a 20-minute build.
#
# - Attacker-influenceable values (the version, the bump) reach `run:` bodies
#   only through `env:`, never inline `${{ }}` interpolation.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored when 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Explicit version override, e.g. 1.2.3 or 1.2.3-beta.1 (optional)"
        type: string
        default: ""
      dry_run:
        description: "Dry run — build + stage everything, publish nothing"
        type: boolean
        default: false
      review_notes:
        description: "I want to review the release notes before publishing (leaves the release as a draft)"
        type: boolean
        default: false

permissions:
  contents: write # create the git tag and the GitHub Release
  packages: write # push the backend image to GHCR

# One release at a time; never cancel a half-finished publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Decide the version. Base it on the HIGHER of the latest release tag and the
  # committed desktop/package.json, so a version bumped during development is
  # never walked backwards, then apply the requested bump.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }} # X.Y.Z (no leading v)
      tag: ${{ steps.compute.outputs.tag }} # vX.Y.Z
      prerelease: ${{ steps.compute.outputs.prerelease }}
      dry_run: ${{ steps.compute.outputs.dry_run }}
      review_notes: ${{ steps.compute.outputs.review_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the full tag history to compute the next version

      - name: Compute the release version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
          REVIEW: ${{ inputs.review_notes }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          pkg="$(node -p "require('./desktop/package.json').version")"

          if [ -n "$OVERRIDE" ]; then
            ver="${OVERRIDE#v}"
          else
            latest_tag="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)"
            # The git tag is the source of truth. desktop/package.json stays a
            # 0.0.0 dev sentinel (never hand-bumped), so base is normally just
            # the newest tag; the pkg floor only matters if someone raises it.
            base="$(printf '%s\n%s\n' "${latest_tag:-0.0.0}" "${pkg%%-*}" | sort -V | tail -1)"
            IFS=. read -r MA MI PA <<<"$base"
            case "$BUMP" in
              patch) PA=$((PA + 1)) ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac
            ver="$MA.$MI.$PA"
          fi

          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::computed version '$ver' is not valid semver"; exit 1
          fi

          prerelease=false
          [[ "$ver" == *-* ]] && prerelease=true

          {
            echo "version=$ver"
            echo "tag=v$ver"
            echo "prerelease=$prerelease"
            echo "dry_run=$DRY"
            echo "review_notes=$REVIEW"
          } >> "$GITHUB_OUTPUT"
          echo "### Release v$ver  (bump=${OVERRIDE:+explicit }$BUMP · prerelease=$prerelease · dry_run=$DRY)" >> "$GITHUB_STEP_SUMMARY"

      - name: "Guard: tag and release are not already taken"
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists — pick a different bump/version."; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG already exists."; exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build the backend image (ghcr.io/tkadauke/syrus-backend) NATIVELY per
  # architecture — NO QEMU. Each matrix leg runs on its own CPU (amd64 on
  # ubuntu-latest, arm64 on ubuntu-24.04-arm — GitHub arm64 runners went GA for
  # private repos 2026-01-29), builds its arch, runs the integration gate
  # against it, and on a real run pushes THAT arch by digest. `merge-backend`
  # then assembles the two digests into the multi-arch :VERSION tag; `:latest`
  # moves later, in `publish`. dry_run builds + integration-tests BOTH arches
  # natively (a faithful rehearsal) and pushes nothing.
  #
  # This replaced a single-runner `buildx --platform amd64,arm64` build whose
  # arm64 half ran under QEMU (~40 min) and where only ONE arch was ever tested.
  # ---------------------------------------------------------------------------
  build-backend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The fat image (mise ruby/node/python/go toolchain), its mode=max build
      # cache, and the integration Compose stack overflow the runner's ~14GB
      # free. Reclaim ~30GB of preinstalled SDKs we don't use — this job runs no
      # setup-node/go, so the toolcache can go wholesale. Native single-arch
      # builds need far less than the old QEMU multi-arch fat build, but keep
      # the reclaim as headroom.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/lib/jvm \
            /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      # No QEMU emulation here — each arch builds on its own native CPU.
      - uses: docker/setup-buildx-action@v4

      # Log in so BuildKit's registry cache can read/write and the by-digest
      # push authenticates (via the ambient docker config, even though
      # bin/publish-image --no-push skips its own login).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build THIS arch natively and run bin/test-docker against it. --no-push
      # builds + integration-tests, then stops — identical on dry and real runs,
      # so BOTH arches are always exercised (the dry run's whole point). The
      # per-arch cache ref keeps the two legs from clobbering each other's
      # mode=max cache.
      - name: Build + integration-test (native ${{ matrix.arch }})
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SYRUS_DOCKER_REGISTRY_CACHE: "1"
          SYRUS_DOCKER_CACHE_REF: ghcr.io/tkadauke/syrus-backend:buildcache-${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The build timestamp is DERIVED FROM THE SOURCE (HEAD's committer
          # date, UTC ISO-8601), never the wall clock: both matrix legs and
          # the push step below check out the same SHA, so every arch image
          # in the released multi-arch manifest bakes the IDENTICAL
          # SYRUS_BUILT_AT — and the desktop build stamps the same instant
          # (stage-backend-assets.mjs), so the BuildBadge's app and backend
          # tooltips agree on a release. Keep this expression in lockstep with
          # the push step below (spec/scripts/docker_image_scripts_spec.rb
          # pins both).
          SYRUS_BUILT_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%SZ' HEAD)"
          export SYRUS_BUILT_AT
          bin/publish-image "$VERSION" --no-push

      # Real runs only: push THIS arch by digest (a tagless manifest). The build
      # is a cache hit from the step above, so this is the registry upload, not
      # a rebuild. No PAT needed — the built-in GITHUB_TOKEN can push the
      # repo-connected syrus-backend package. merge-backend combines the digests.
      - name: Push ${{ matrix.arch }} by digest
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          PLATFORM: ${{ matrix.platform }}
          CACHE_REF: ghcr.io/tkadauke/syrus-backend:buildcache-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # Build args must match what bin/publish-image passed above, or this
          # "cache-hit re-push" silently rebuilds a DIFFERENT image (empty
          # SYRUS_VERSION / SYRUS_BUILT_AT) than the one the integration gate
          # tested. SYRUS_BUILT_AT re-derives from HEAD's committer date —
          # deterministic, so it matches the build step and the other matrix
          # leg without any GITHUB_ENV hand-off.
          SYRUS_BUILT_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%SZ' HEAD)"
          docker buildx build -f Dockerfile --target worker-dev \
            --build-arg "GIT_SHA=$(git rev-parse --short HEAD)" \
            --build-arg "SYRUS_VERSION=$VERSION" \
            --build-arg "SYRUS_BUILT_AT=$SYRUS_BUILT_AT" \
            --platform "$PLATFORM" --provenance=false \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          echo "pushed $PLATFORM as $digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.dry_run == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Assemble the per-arch digests into one multi-arch :VERSION manifest (a
  # metadata-only registry op — no rebuild). Skipped on dry runs (nothing was
  # pushed). `:latest` still moves later, in `publish`.
  # ---------------------------------------------------------------------------
  merge-backend:
    needs: [prepare, build-backend]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Assemble the multi-arch :VERSION manifest
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd /tmp/digests
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          if [ "${#refs[@]}" -eq 0 ]; then echo "::error::no per-arch digests to merge"; exit 1; fi
          echo "merging ${#refs[@]} arch(es) into $IMAGE:$VERSION"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${refs[@]}"

      - name: Verify the versioned manifest exists
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          . ./bin/docker-image-lib
          syrus_verify_pushed "$IMAGE" "$VERSION"

  # ---------------------------------------------------------------------------
  # Cross-compile the CLI and stage the tarballs + checksums.
  # ---------------------------------------------------------------------------
  build-cli:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Build CLI release tarballs
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bin/release-cli "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: staged-cli
          path: dist/releases/${{ needs.prepare.outputs.tag }}/cli/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS: sign + notarize + staple, then STAGE (never publish). The signed
  # .app is verified before its artifacts are uploaded.
  # ---------------------------------------------------------------------------
  build-mac:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Signing runs on dry runs too — it's the fragile part worth rehearsing.
      # dry_run only gates PUBLISH, not the build/sign.
      - name: "Guard: signing secrets present"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$APPLE_API_KEY_P8" ]]; then
            echo "::error::Signing secrets missing (CSC_LINK / APPLE_API_KEY_P8). A signed build is required — set them in repo secrets (dry runs sign too)."
            exit 1
          fi

      # Catch bad Apple credentials in seconds, before the ~15-minute build:
      # decode the p12, check the password, require a "Developer ID Application"
      # cert (an "Apple Development" cert signs then FAILS notarization), refuse
      # expired certs, and prove the notary API key works with a cheap call.
      - name: "Preflight: Apple signing credentials"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/preflight.p12"
          PEM="$RUNNER_TEMP/preflight.pem"
          if ! printf '%s' "$CSC_LINK" | base64 -d > "$P12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64 — re-export with: base64 -i cert.p12 (single line)."
            exit 1
          fi
          if ! openssl pkcs12 -in "$P12" -nokeys -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
            if ! openssl pkcs12 -in "$P12" -nokeys -legacy -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
              echo "::error::Could not open the p12 with CSC_KEY_PASSWORD — wrong password or corrupted p12."
              exit 1
            fi
          fi
          SUBJECT=$(openssl x509 -in "$PEM" -noout -subject)
          echo "cert subject: $SUBJECT"
          if ! grep -q "Developer ID Application" <<<"$SUBJECT"; then
            echo "::error::CSC_LINK is not a 'Developer ID Application' certificate ($SUBJECT). Apple Development / Distribution certs sign locally but FAIL notarization."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 0; then
            echo "::error::The Developer ID certificate has EXPIRED. Create a new one and update CSC_LINK/CSC_KEY_PASSWORD."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 2592000; then
            echo "::warning::The Developer ID certificate expires within 30 days — rotate CSC_LINK soon."
          fi
          rm -f "$P12" "$PEM"
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_API_KEY_ID doesn't look like a 10-character key id — is it swapped with APPLE_API_ISSUER?"
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::APPLE_API_ISSUER doesn't look like a UUID — is it swapped with APPLE_API_KEY_ID?"
            exit 1
          fi
          KEY="$RUNNER_TEMP/preflight_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          if ! xcrun notarytool history --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null; then
            echo "::error::notarytool rejected the App Store Connect API key. It must be a TEAM key with the Developer role."
            exit 1
          fi
          rm -f "$KEY"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The desktop build cross-compiles the Syrus CLI into the app bundle
      # (desktop/scripts/stage-cli.mjs). macos-15 runners ship NO Go, so
      # 0.1.1/0.1.2 released with an empty Resources/cli (stage-cli used to
      # soft-skip) and every in-app CLI/skill install died with ENOENT. The
      # script now hard-fails under SYRUS_RELEASE_BUILD=1; this pinned
      # toolchain (same source of truth as build-cli) makes it never trigger.
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: npm ci --prefix desktop

      # The pipeline owns the version: stamp it into package.json before the
      # build so the produced app carries the release version.
      - name: Set version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm --prefix desktop version "$VERSION" --no-git-tag-version --allow-same-version

      # notarytool needs the App Store Connect API key (a .p8 secret) as a file.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"

      # forceCodeSigning turns electron-builder's silent skip-signing paths into
      # hard failures. --publish never: we STAGE, we don't upload. One retry,
      # but never on a deterministic verdict: a notarization "Invalid" or a
      # stage-cli hard-fail (no Go toolchain under SYRUS_RELEASE_BUILD=1)
      # fails identically on retry, so fail fast instead.
      - name: Build, sign, and notarize
        timeout-minutes: 60
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SYRUS_RELEASE_BUILD: "1"
        run: |
          set -o pipefail
          build() {
            npm --prefix desktop run build -- --publish never -c.forceCodeSigning=true 2>&1 | tee "$RUNNER_TEMP/build.log"
          }
          if build; then exit 0; fi
          if grep -q '"status":"Invalid"\|status: Invalid' "$RUNNER_TEMP/build.log"; then
            echo "::error::Notarization verdict was Invalid — deterministic, not retrying. See the developer log artifact."
            exit 1
          fi
          # stage-cli.mjs hard-fails under SYRUS_RELEASE_BUILD=1 when the Go
          # toolchain is missing — deterministic, a retry cannot fix it.
          if grep -qF 'stage-cli: Go toolchain not found' "$RUNNER_TEMP/build.log"; then
            echo "::error::stage-cli hard-failed: no Go toolchain on the runner — deterministic, not retrying. Fix the actions/setup-go step (go-version-file: cli/go.mod)."
            exit 1
          fi
          echo "::warning::Build/notarization failed with a non-deterministic error — retrying once in 90s."
          sleep 90
          build

      - name: Fetch notarytool developer log
        if: failure()
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ID=$(grep -oE '"id"[[:space:]]*:[[:space:]]*"[0-9a-f-]{36}"' "$RUNNER_TEMP/build.log" | tail -1 | grep -oE '[0-9a-f-]{36}') || true
          if [[ -n "${ID:-}" ]]; then
            xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" "$RUNNER_TEMP/notary_developer_log.json" || true
          fi
          cp "$RUNNER_TEMP/build.log" . 2>/dev/null || true
          cp "$RUNNER_TEMP/notary_developer_log.json" . 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-release-diagnostics
          path: |
            build.log
            notary_developer_log.json
          if-no-files-found: ignore
          retention-days: 14

      # stapler runs against the .app — the DMG container carries no ticket of
      # its own (Error 65 there is expected, not a failure).
      - name: Verify signature, notarization, and update feed
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # One universal app that runs on both Apple Silicon and Intel.
          APP="desktop/out/mac-universal/Syrus.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep "Developer ID Application"
          spctl -a -t exec -vv "$APP" 2>&1 | grep "Notarized Developer ID"
          xcrun stapler validate "$APP"
          test -f desktop/out/latest-mac.yml
          grep -q "Syrus-$VERSION-universal.zip" desktop/out/latest-mac.yml
          test -f "desktop/out/Syrus-$VERSION-universal.zip"
          # The bundled CLI must be INSIDE the built app — 0.1.1/0.1.2 shipped
          # without Resources/cli (no Go on the runner; stage-cli soft-skipped)
          # and every in-app CLI/skill install threw ENOENT. Both darwin arches
          # ride the universal app; ensureCliCurrent installs the matching one.
          test -x "$APP/Contents/Resources/cli/syrus-darwin-arm64"
          test -x "$APP/Contents/Resources/cli/syrus-darwin-x64"

      # Stage only what's needed. Humans download ONE dmg — the stable-named
      # `Syrus.dmg` permalink. macOS auto-update uses the versioned `.zip` +
      # `latest-mac.yml` (Squirrel.Mac never touches the dmg), plus the
      # `.zip.blockmap` for delta downloads. The *versioned* dmg and its
      # blockmap are deliberately NOT staged: they'd be a byte-identical twin of
      # Syrus.dmg that nothing references.
      - name: Stage macOS artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          cp "desktop/out/Syrus-$VERSION-universal.zip" "$RUNNER_TEMP/staged/" 2>/dev/null || true
          cp "desktop/out/Syrus-$VERSION-universal.zip.blockmap" "$RUNNER_TEMP/staged/" 2>/dev/null || true
          cp desktop/out/latest-mac.yml "$RUNNER_TEMP/staged/" 2>/dev/null || true
          cp "desktop/out/Syrus-$VERSION-universal.dmg" "$RUNNER_TEMP/staged/Syrus.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: staged-mac
          path: ${{ runner.temp }}/staged/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows: Azure Trusted Signing, then STAGE. Runs in parallel with macOS —
  # neither creates the release now, so the old create-release 422 race is gone.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Azure signing runs on dry runs too (it's the fragile part worth
      # rehearsing); dry_run only gates PUBLISH.
      - name: "Guard: Azure signing configuration present"
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          missing=()
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT_NAME AZURE_SIGN_CERT_PROFILE AZURE_SIGN_PUBLISHER_NAME; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Azure signing configuration missing: ${missing[*]} — see docs/windows-signing.md. A signed build is required — set them in repo secrets/variables (dry runs sign too)."
            exit 1
          fi

      # A 401 here is a credential problem; a 403 later at sign time is a
      # role/profile problem (different fixes — see the runbook).
      - name: "Preflight: Azure credentials"
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $body = @{
            grant_type    = "client_credentials"
            client_id     = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            scope         = "https://codesigning.azure.net/.default"
          }
          try {
            $null = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:AZURE_TENANT_ID)/oauth2/v2.0/token" -Body $body
            Write-Host "Azure token acquisition OK"
          } catch {
            Write-Host "::error::Azure credential preflight failed: $($_.Exception.Message). Check AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET (single-tenant app registration; secrets expire)."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # windows-latest runners usually ship Go, but pin it anyway — parity
      # with build-mac/build-cli and determinism over runner-image drift. The
      # desktop build needs it to bundle the CLI (stage-cli.mjs hard-fails
      # without it under SYRUS_RELEASE_BUILD=1).
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: npm ci --prefix desktop

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm --prefix desktop version "$VERSION" --no-git-tag-version --allow-same-version

      # electron-builder installs the TrustedSigning module on first use; do it
      # once here (with retries) to dodge transient gallery failures.
      - name: "Preflight: TrustedSigning module"
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($true) {
            try {
              Install-Module -Name TrustedSigning -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              $attempts += 1
              if ($attempts -ge 3) { Write-Host "::error::Could not install the TrustedSigning module: $($_.Exception.Message)"; exit 1 }
              Start-Sleep -Seconds 20
            }
          }

      # win.azureSignOptions is intentionally NOT in the checked-in
      # electron-builder.yml (its mere presence forces signing on every unsigned
      # dev cross-build). Inject it here, only in a job that has the credentials.
      - name: Build and sign
        timeout-minutes: 45
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
          SYRUS_RELEASE_BUILD: "1"
        run: |
          AZURE_SIGN_ENDPOINT="${AZURE_SIGN_ENDPOINT%/}"
          npm --prefix desktop run build -- --win --publish never \
            -c.forceCodeSigning=true \
            "-c.win.azureSignOptions.publisherName=${AZURE_SIGN_PUBLISHER_NAME}" \
            "-c.win.azureSignOptions.endpoint=${AZURE_SIGN_ENDPOINT}" \
            "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGN_CERT_PROFILE}" \
            "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGN_ACCOUNT_NAME}"

      - name: Verify signatures and update feed
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path desktop/out -Filter "Syrus-Setup-*.exe"
          if ($exes.Count -eq 0) { throw "No Syrus-Setup-*.exe artifacts found under desktop/out" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { throw "$($exe.Name) is not validly signed (status: $($sig.Status))" }
          }
          if (-not (Test-Path "desktop/out/latest.yml")) { throw "latest.yml missing - Windows auto-update feed would be broken" }
          # The bundled CLI must be in the packaged resources (win-unpacked is
          # what NSIS wraps). Same 0.1.1/0.1.2 failure mode as macOS: stage-cli
          # soft-skipping without Go shipped installers with no CLI to install.
          if (-not (Test-Path "desktop/out/win-unpacked/resources/cli/syrus-win32-x64.exe")) { throw "Bundled CLI missing - desktop/out/win-unpacked/resources/cli/syrus-win32-x64.exe not found (stage-cli must have been skipped)" }

      - name: Stage Windows artifacts
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          # Windows auto-update uses the versioned .exe itself (+ blockmap for
          # deltas) + latest.yml, so unlike macOS the versioned installer stays.
          # Syrus-Setup.exe is the stable website-permalink copy of it.
          cp "desktop/out/Syrus-Setup-$VERSION-x64.exe" "$RUNNER_TEMP/staged/" 2>/dev/null || true
          cp "desktop/out/Syrus-Setup-$VERSION-x64.exe.blockmap" "$RUNNER_TEMP/staged/" 2>/dev/null || true
          cp desktop/out/latest.yml "$RUNNER_TEMP/staged/" 2>/dev/null || true
          # x64 only — runs natively on x64 and via emulation on arm64 Windows.
          cp "desktop/out/Syrus-Setup-$VERSION-x64.exe" "$RUNNER_TEMP/staged/Syrus-Setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: staged-windows
          path: ${{ runner.temp }}/staged/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The near-atomic go-live. Only reached when EVERY build succeeded (skipped on
  # a dry run). Builds the release as an invisible DRAFT, moves :latest, then
  # flips the draft to published as the final tiny action — and rolls the whole
  # thing back if anything fails. See the step comments.
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, merge-backend, build-cli, build-mac, build-windows]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download staged artifacts
        uses: actions/download-artifact@v8
        with:
          path: staged
          pattern: staged-*
          merge-multiple: true

      # Near-atomic publish. The ONLY visible go-live is the final tiny "flip
      # the draft to published" call — everything before it is either invisible
      # (a DRAFT release nobody can see) or reversible (:latest can be pointed
      # back). If any step fails, the failure-cleanup step below deletes the
      # draft + tag and reverts :latest, so a failed run leaves NO half-published
      # state. (The one residue is the versioned image build-backend already
      # pushed — a tested, unreferenced tag, overwritten on the next attempt.)
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Remember where :latest points now, so cleanup can put it back.
      - name: Snapshot the current :latest digest
        id: snap
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/tkadauke/syrus-backend"
          OLD="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          echo "old_latest=$OLD" >> "$GITHUB_OUTPUT"
          echo "current :latest = ${OLD:-<none>}"

      # Build the release as a DRAFT: uploads every asset and generates notes,
      # but it's invisible. (A draft does NOT create the git tag — GitHub defers
      # that until the draft is published, which only strengthens atomicity: a
      # failed run leaves no tag at all.) A partial/failed upload leaves an
      # invisible draft, cleaned up on failure — never a half-populated release.
      - name: Create the draft release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TARGET: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # args already carries the `release create` subcommand, so it is
          # invoked below as `gh "${args[@]}"`. Prefixing the call with the
          # subcommand again would double it (gh would then treat the extra
          # `create` token as a missing asset file and fail the whole publish).
          args=(release create "$TAG" --draft --title "Syrus $TAG" --generate-notes --target "$TARGET")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          mapfile -t assets < <(find staged -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then echo "::error::no staged artifacts to publish"; exit 1; fi
          gh "${args[@]}" "${assets[@]}"

      # Replace the draft's mechanical --generate-notes body with Claude-written
      # HIGHLIGHTS on top of GitHub's PR list: the LLM curates the story; the
      # mechanical "Full changelog" below stays hallucination-proof (real PRs,
      # correct attribution). Non-fatal — if CLAUDE_API_KEY is unset or the API
      # errors, the mechanical notes GitHub already generated stand.
      - name: Write LLM release notes (highlights over the mechanical changelog)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLAUDE_API_KEY:-}" ]; then
            echo "::warning::CLAUDE_API_KEY not set — keeping GitHub's mechanical notes."
            exit 0
          fi
          mechanical="$(gh release view "$TAG" --json body -q .body)"
          if ! highlights="$(bin/release-notes "$VERSION" --stdout)"; then
            echo "::warning::LLM notes generation failed — keeping GitHub's mechanical notes."
            exit 0
          fi
          {
            printf '%s\n' "$highlights"
            printf '\n---\n\n## Full changelog\n\n%s\n' "$mechanical"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Move :latest to the released image (imagetools copies the manifest — no
      # rebuild). Reversible by cleanup below.
      - name: Move image :latest to the released version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/tkadauke/syrus-backend"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"

      # THE go-live: flip the fully-built draft to published. One tiny API call,
      # the last irreversible action. Everything above is now proven good.
      # Skipped when review_notes is set — the release stays a draft for a human
      # to read the notes and click Publish. (:latest already moved above; that's
      # the backend image, independent of the release's visibility.)
      - name: Publish the release
        if: needs.prepare.outputs.review_notes != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false

      # review_notes path: leave the draft unpublished and point the maintainer at it.
      - name: Hold the release as a draft for notes review
        if: needs.prepare.outputs.review_notes == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG" --json url -q .url)"
          echo "::notice::$TAG is a DRAFT for review — edit the notes and click Publish: $url"
          echo "### 📝 Review the release notes, then click Publish: [$TAG]($url)" >> "$GITHUB_STEP_SUMMARY"

      # Ran only if any step above failed: undo everything so the run leaves no
      # half-published state. Best-effort (|| true) — a stuck resource is better
      # surfaced than masked, but we try hard to restore a clean slate.
      - name: Roll back on failure
        if: failure()
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          OLD_LATEST: ${{ steps.snap.outputs.old_latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/tkadauke/syrus-backend"
          echo "::warning::Publish failed — rolling back the draft release and :latest."
          # Deletes the draft (and its tag if the flip already created one).
          gh release delete "$TAG" --yes --cleanup-tag || true
          if [ -n "${OLD_LATEST:-}" ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$OLD_LATEST" || true
          fi

  # ---------------------------------------------------------------------------
  # Deploy the website as the final release step, by CALLING the shared
  # deploy-website workflow — the same one you can run standalone (or that runs
  # on website/** pushes) to update the site WITHOUT a release. One copy of the
  # deploy logic, invoked here and there.
  # ---------------------------------------------------------------------------
  publish-website:
    needs: [prepare, publish]
    # Skip while a release is held for notes review — deploy the site once it's
    # actually published (re-run "Deploy website" manually, or it auto-runs on
    # the next website/** push).
    if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.review_notes != 'true'
    uses: ./.github/workflows/deploy-website.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
