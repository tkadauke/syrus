# The website's build + deploy, in ONE place, reachable three ways:
#
#   - workflow_call  — the release pipeline invokes it as its final step, so a
#                      release refreshes the site (release.yml -> publish-website).
#   - workflow_dispatch — run it on its own to redeploy the site any time
#                      (a docs fix, a copy change) WITHOUT cutting a release.
#   - push (website/**) — auto-redeploy when website content lands on main.
#
# The build/deploy steps live here and nowhere else, so a website-only update
# never means duplicating the release job.
#
# The site is a static-exported Next.js app under website/ (output: "export").
# It builds to website/out/ and deploys to GitHub Pages. Download links use the
# stable releases/latest/download/ permalinks, so a new release only needs this
# to run to refresh the displayed version/sizes (npm run sync-release).
#
# ONE-TIME SETUP (needs repo admin): Settings → Pages → Source = "GitHub
# Actions", and set the custom domain to syrus-ai.dev (public/CNAME already
# carries it) with "Enforce HTTPS". Until Pages is enabled, configure-pages
# tries to enable it (enablement: true), which needs the token to be allowed to.
name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_call:
    inputs:
      release_tag:
        description: "The release this deploy corresponds to (blank for standalone runs)"
        type: string
        required: false
        default: ""

# Pages deploy needs to write the Pages deployment and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh release metadata (version + sizes shown on /download)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync-release

      - name: Build static site
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          # Best-effort enable Pages (build_type: workflow) if an admin hasn't
          # yet. If the token isn't allowed to, enable it once in Settings → Pages.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
