# Proves Azure Artifact Signing end-to-end on a real Windows runner WITHOUT
# cutting a release. The real release pipeline (release.yml, build-windows job)
# signs and ships Windows the same way; this manual harness lets you validate
# the Azure setup (docs/windows-signing.md) — a new certificate profile, a
# rotated client secret, a fresh service principal — before a release depends
# on it. Keep the signing invocation here in sync with release.yml.
name: Sign Windows build (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The four AZURE_SIGN_* values are account identifiers, not
      # credentials — they may live as repo Variables (visible) or Secrets;
      # either works. The first three are real credentials and must be
      # Secrets.
      - name: "Guard: Azure signing secrets present"
        shell: bash
        run: |
          missing=()
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT_NAME AZURE_SIGN_CERT_PROFILE AZURE_SIGN_PUBLISHER_NAME; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets/variables: ${missing[*]}. See docs/windows-signing.md."
            exit 1
          fi
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix desktop

      # win.azureSignOptions is intentionally NOT in the checked-in
      # electron-builder.yml: its mere presence makes electron-builder
      # attempt Azure signing unconditionally (unlike CSC_LINK on macOS,
      # there's no "absent -> skip silently" fallback), which would break
      # every unsigned local/dev Windows cross-build. Inject it only here,
      # via CLI dot-path overrides, only in a job that has the credentials.
      - name: Build and sign (arm64 + x64)
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          # Normalize the endpoint: the portal shows it with a trailing
          # slash, Invoke-TrustedSigning wants the bare origin.
          AZURE_SIGN_ENDPOINT="${AZURE_SIGN_ENDPOINT%/}"
          npm --prefix desktop run build -- --win --publish never \
            "-c.win.azureSignOptions.publisherName=${AZURE_SIGN_PUBLISHER_NAME}" \
            "-c.win.azureSignOptions.endpoint=${AZURE_SIGN_ENDPOINT}" \
            "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGN_CERT_PROFILE}" \
            "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGN_ACCOUNT_NAME}"

      - name: Verify the signature
        shell: pwsh
        run: |
          $exes = Get-ChildItem -Path desktop/out -Filter "Syrus-Setup-*.exe" -Recurse
          if ($exes.Count -eq 0) { throw "No Syrus-Setup-*.exe artifacts found under desktop/out" }
          foreach ($exe in $exes) {
            Write-Host "== $($exe.FullName)"
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "Status: $($sig.Status)"
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") {
              throw "$($exe.Name) is not validly signed (status: $($sig.Status))"
            }
          }

      - name: Upload signed installers for inspection
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installers
          path: desktop/out/Syrus-Setup-*.exe
          retention-days: 7
