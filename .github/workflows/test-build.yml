# A TEST BUILD: deterministically build every shippable component from any
# ref — the backend image is PUSHED to GHCR under a collision-proof test tag,
# and the signed macOS DMG + Windows installer are built with that exact tag
# manifested in — while making publishing structurally impossible.
#
# This is a THIN caller of the shared `_build-app.yml` module — the SAME build
# spine release.yml uses, so a test build can never test a different artifact
# than a release ships. The differences are all inputs:
#
# - `permissions: contents: read` — this workflow CANNOT create a git tag or a
#   GitHub Release even if a step tried. The only write scope is `packages`
#   (the test image push). The module needs no more than this.
# - The backend image is ALWAYS pushed (push_image: true), as
#   ghcr.io/tkadauke/syrus-backend:test-<short-sha> plus the version-named twin
#   test-<X.Y.Z-test.N> — never a semver tag, never `:latest` (guarded in
#   `prepare`). A test tag can therefore never collide with or shadow a release.
# - The desktop apps are versioned `X.Y.Z-test.<run-number>` (the next patch
#   over the same tag/package.json base release.yml uses) so a test build can
#   never be mistaken for a release. Auto-update is disarmed in BOTH
#   directions: release installs never see a test build (stage_update_feed is
#   false, so nothing stages or publishes feed files), and test installs never
#   self-replace — appUpdates.ts skips auto-update for `-test.` versions,
#   because the baked-in GitHub feed plus semver ordering (X.Y.Z-test.N < X.Y.Z)
#   would otherwise swap a pinned evaluation for the next published release.
# - Artifacts land on the WORKFLOW RUN (test-staged-mac / test-staged-windows /
#   test-staged-cli, 14 days), not in a GitHub Release, and there are no
#   stable-name aliases (Syrus.dmg / Syrus-Setup.exe imply the website
#   permalinks — releases only).
# - There is no publish job at all: no draft release, no `:latest` move, no
#   LLM notes, no website deploy — this file has only `prepare` + `build`.
#
# Signing runs exactly like a real release (guards + preflights included, in the
# module) — rehearsing the fragile part is half the value of a test build.
#
# Attacker-influenceable values (the computed tag/version) reach `run:` bodies
# only through `env:`, never inline ${{ }} interpolation — same rule as
# release.yml.
name: Test build

on:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Run bin/test-docker against each built arch before pushing"
        type: boolean
        default: true
      build_windows:
        description: "Also build + sign the Windows installer"
        type: boolean
        default: true

permissions:
  contents: read # checkout only — creating a tag or Release is structurally impossible
  packages: write # push the test-tagged backend image to GHCR

# Separate group from the real release ("release"): test builds never contend
# with a publish, and a newer test run on the same ref supersedes the old one.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Compute the two identifiers and guard them against release collisions:
  # - image_tag: test-<short-sha> — the GHCR tag for the backend image.
  # - app_version: next patch over release.yml's version base (the HIGHER of
  #   the newest v* tag and the committed desktop/package.json floor) +
  #   -test.<run-number> — what the desktop apps are stamped with (valid
  #   semver, unmistakably not a release).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.compute.outputs.image_tag }} # test-<short-sha>
      app_version: ${{ steps.compute.outputs.app_version }} # X.Y.Z-test.N
      version_tag: ${{ steps.compute.outputs.version_tag }} # test-X.Y.Z-test.N (manifest pin)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the full tag history to compute the base version

      - name: Compute the test identifiers
        id: compute
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          short_sha="$(git rev-parse --short HEAD)"
          image_tag="test-$short_sha"
          # Same version base as release.yml's prepare: the HIGHER of the
          # newest release tag and the committed desktop/package.json (a
          # 0.0.0 dev sentinel normally, but the floor keeps test builds on
          # the right release line during a planned major/minor bump).
          pkg="$(node -p "require('./desktop/package.json').version")"
          latest_tag="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)"
          base="$(printf '%s\n%s\n' "${latest_tag:-0.0.0}" "${pkg%%-*}" | sort -V | tail -1)"
          IFS=. read -r MA MI PA <<<"$base"
          app_version="$MA.$MI.$((PA + 1))-test.$GITHUB_RUN_NUMBER"
          # The image is ALSO tagged test-<app_version> and that tag is what the
          # manifest pins (registry ADDRESSING). The in-app badge shows the
          # SYRUS_VERSION the module BAKES into the image (the app-style
          # version), so it reads identically for both halves:
          # "app 0.1.4-test.1 · backend 0.1.4-test.1". The sha tag stays for
          # traceability back to the commit.
          version_tag="test-$app_version"
          {
            echo "image_tag=$image_tag"
            echo "app_version=$app_version"
            echo "version_tag=$version_tag"
          } >> "$GITHUB_OUTPUT"
          echo "### Test build $app_version (backend image tags: $version_tag + $image_tag, ref: $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # A test tag must NEVER be able to collide with (or be mistaken for) a
      # release tag. The regex alone rules out `latest` and semver, but the
      # explicit checks keep the invariant loud if the tag scheme ever drifts.
      - name: "Guard: test identifiers can never collide with a release"
        env:
          IMAGE_TAG: ${{ steps.compute.outputs.image_tag }}
          APP_VERSION: ${{ steps.compute.outputs.app_version }}
          VERSION_TAG: ${{ steps.compute.outputs.version_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^test-[a-f0-9]{7,}$ ]]; then
            echo "::error::image tag '$IMAGE_TAG' must match ^test-[a-f0-9]{7,}$"; exit 1
          fi
          if [ "$IMAGE_TAG" = "latest" ]; then
            echo "::error::image tag must never be 'latest'"; exit 1
          fi
          if [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::image tag '$IMAGE_TAG' must never look like a release version"; exit 1
          fi
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "::error::app version '$APP_VERSION' must look like X.Y.Z-test.N"; exit 1
          fi
          if ! [[ "$VERSION_TAG" =~ ^test-[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "::error::version tag '$VERSION_TAG' must look like test-X.Y.Z-test.N"; exit 1
          fi
          if [ "$VERSION_TAG" = "latest" ]; then
            echo "::error::version tag must never be 'latest'"; exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build + sign every shippable component through the SHARED reusable module.
  # Test parameters: the sha-named image tag PLUS the version-named twin
  # (image_extra_tag), the test buildcache prefix (its own refs so a divergent
  # branch can't evict the warm cache the next release depends on), the pushed
  # test tag pinned into both installers (backend_image_pin), NO auto-update
  # feed staged, 14-day artifact retention. push_image is always true — uploading
  # the image is the whole point. run_integration_tests / build_windows thread
  # straight through from the dispatch inputs. secrets: inherit hands the module
  # the signing secrets; the module's contents:read + packages:write matches
  # this workflow's grants exactly.
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    uses: ./.github/workflows/_build-app.yml
    with:
      version: ${{ needs.prepare.outputs.app_version }}
      image_primary_tag: ${{ needs.prepare.outputs.image_tag }}
      image_extra_tag: ${{ needs.prepare.outputs.version_tag }}
      backend_image_pin: ghcr.io/tkadauke/syrus-backend:${{ needs.prepare.outputs.version_tag }}
      cache_ref_prefix: ghcr.io/tkadauke/syrus-backend:buildcache-test
      push_image: true
      stage_update_feed: false
      artifact_prefix: test-staged
      artifact_retention_days: 14
      run_integration_tests: ${{ inputs.run_integration_tests }}
      build_windows: ${{ inputs.build_windows }}
      # Fork the product name / appId / icon so this installs as "Syrus Test.app"
      # beside — never over — a production release.
      channel: test
    secrets: inherit
