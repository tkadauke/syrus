name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install native image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42t64 ||
            sudo apt-get install --no-install-recommends -y libvips42 ||
            sudo apt-get install --no-install-recommends -y libvips

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check migration baselines
        run: bin/check-primary-migration-baselines

      # The serial `bin/rspec` (no parallelism, no tag filter) now takes
      # 50-56+ minutes on its own — see .syrus.yml's `rspec` grader, whose
      # own timeout was separately widened to 75 minutes for the same
      # reason. That left this job's old 30-minute budget unable to even
      # finish a normal green run, so it was killed mid-suite with no
      # parseable failure output. Run the same parallel + ci_only command
      # the `rspec` grader's `ci:` variant uses instead (bin/rspec-ci:
      # db:test:prepare, bin/rspec-fast, then the :ci_only examples), and
      # give the job matching headroom.
      - name: Run RSpec
        run: bin/rspec-ci

  react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run React tests and typecheck
        run: bin/test-react
