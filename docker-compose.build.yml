# Developer override: build the image from THIS checkout instead of pulling the
# published one. `bin/compose-up` merges it on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Recipients who just want to run Syrus ignore this file entirely — `install.sh`
# pulls the prebuilt image and never builds. Use this only when changing source
# or adding EXTRA_APT_PACKAGES to the worker toolchain.
services:
  setup:
    build: &build
      context: .
      dockerfile: Dockerfile.local
      args:
        BASE_IMAGE: ${BASE_IMAGE:-syrus-backend-base:latest}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    image: syrus-backend:latest
  web:
    build: *build
    image: syrus-backend:latest
  worker:
    build: *build
    image: syrus-backend:latest
  # The runtime manager builds from its source in the plugin too, so a source
  # checkout never depends on a published manager image. Plugin service images
  # it starts are still pulled (set SYRUS_GIT_MIRROR_IMAGE etc. to test local
  # ones -- they must be tagged under ghcr.io/tkadauke/ to pass its policy).
  plugin-runtime:
    build:
      context: plugins/plugin_runtime/container
    image: syrus-plugin-runtime:latest
