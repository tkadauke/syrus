# Packaging for the Syrus desktop app. Signing + notarization activate when
# the Apple credentials are present in the environment (CSC_LINK,
# CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER —
# see .github/workflows/release.yml); local builds without them
# produce unsigned artifacts for development only. Never ship an unsigned
# release build: Gatekeeper blocks it and auto-update refuses to install it.
appId: app.syrus.desktop
productName: Syrus
directories:
  output: out
  buildResources: build
files:
  - assets/**/*
  - dist/**/*
  - dist-electron/**/*
  - package.json
# Staged by scripts/stage-backend-assets.mjs: install.sh + install.ps1,
# docker-compose.yml, compose.env.example, manifest.json (the backend image
# pin for this app version). Sealed by the code signature — never written to
# at runtime.
extraResources:
  - from: resources/backend
    to: backend
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # 512px master; a 1024px design asset would sharpen the Retina dock icon.
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # The Syrus CLI (pure-Go binaries staged by scripts/stage-cli.mjs).
  # Per-platform filters keep ~40 MB of the other OS's binaries out of each
  # package; Preferences installs from here — it powers the tray's Checkout
  # and terminal/agent workflows. Both darwin arches ride along so
  # ensureCliCurrent can install the one matching the running arch.
  extraResources:
    - from: resources/cli
      to: cli
      filter: ["syrus-darwin-*"]
  # The CLI binaries are single-arch Mach-O files, identical in both arch app
  # builds. Without this, @electron/universal fails the merge ("Detected file
  # ... same in both x64 and arm64 builds and not covered by the x64ArchFiles
  # rule"). This tells it to keep them as-is (both arches' CLI end up bundled).
  x64ArchFiles: "**/cli/*"
  target:
    # ONE universal (arm64 + x64) build — a single Syrus.dmg that runs on both
    # Apple Silicon and Intel, no Intel-vs-Apple-Silicon download split. Both
    # per-arch CLI binaries ride along (filter syrus-darwin-* matches both);
    # ensureCliCurrent installs the one matching the running arch.
    # zip is REQUIRED alongside dmg: electron-updater installs updates from the
    # zip, and latest-mac.yml references it.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
# Finder-layout fixes the dmg config schema can't express: dev builds get a
# unique volume name per build (Finder caches window geometry per volume
# name, so remounts of a same-named volume reuse stale geometry), and the
# dmgbuild helper dotfiles (.background.tiff, .VolumeIcon.icns, .DS_Store)
# get icon positions below the visible window so "show hidden files" users
# see only Syrus.app. See the hook's header comment for the full story.
artifactBuildStarted: ./scripts/dmg-finder-layout.cjs
dmg:
  # Release volume name ("Syrus 0.1.2"). Non-release builds (no
  # SYRUS_RELEASE_BUILD=1) get a "(<sha>-<hhmmss>)" suffix appended by
  # scripts/dmg-finder-layout.cjs.
  title: Syrus ${version}
  iconSize: 128
  # Double-click install: one centered icon, no /Applications drag target —
  # the app copies itself into ~/Applications on first launch (see
  # electron/selfInstall.ts). Background is generated by
  # scripts/render-dmg-background.mjs (1x/2x combined via
  # `tiffutil -cathidpicheck`); its text positions assume the icon slot below.
  background: build/dmg-background.tiff
  # NOTE: dmg-builder ignores this window block when a background image is
  # set — it sizes the Finder window frame from the background's 1x pixel
  # size instead (sips). The values are kept here as documentation and must
  # match the tiff: 660 wide, 400 of visible design + 33 of title-bar pad
  # (Finder puts the title bar INSIDE the frame height, so a pad-less frame
  # clips the bottom 28-33pt of the design). Keep in sync with WIDTH /
  # DESIGN_HEIGHT / TITLE_BAR_PAD in scripts/render-dmg-background.mjs.
  window:
    width: 660
    height: 433
  contents:
    - x: 330
      y: 175
      type: file
# NSIS one-click, not MSI: electron-updater auto-updates NSIS installs but
# not MSI, and auto-update is what keeps the pinned backend image current.
# Per-user install (no admin), silent /S for fleets. Unsigned until the
# Authenticode cert lands — see docs/windows-desktop-plan.md.
win:
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  # Windows twin of the mac CLI FileSet above. x64 only (the app is x64).
  extraResources:
    - from: resources/cli
      to: cli
      filter: ["syrus-win32-x64*"]
  # x64 only: Windows 11 on ARM runs x64 installers and apps (and the bundled
  # x64 CLI) via built-in emulation, so one x64 build covers every Windows
  # machine. Native arm64 would be a marginal perf win for a rounding-error
  # share of users; not worth a second artifact.
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Syrus
  # Brand the one-click UI: the setup exe's own icon, and the icon the
  # progress dialog (SpiderBanner) shows next to "Installing, please wait".
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Post-extraction guard: fail loudly (Defender guidance) instead of the
  # shell's "Missing Shortcut" dialog when the exe vanishes before launch.
  include: build/installer.nsh
linux:
  category: Development
  syncDesktopName: true
  target:
    - AppImage
# The auto-update feed. Baked into shipped apps (app-update.yml) — changing
# it later strands installed apps on the old feed.
publish:
  - provider: github
    owner: tkadauke
    repo: syrus
    # electron-builder defaults to DRAFT releases, which are invisible to
    # both auto-update and the website's releases/latest permalink.
    releaseType: release
