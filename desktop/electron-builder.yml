# Packaging for the Syrus desktop app. Signing + notarization activate when
# the Apple credentials are present in the environment (CSC_LINK,
# CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER —
# see .github/workflows/release.yml); local builds without them
# produce unsigned artifacts for development only. Never ship an unsigned
# release build: Gatekeeper blocks it and auto-update refuses to install it.
appId: app.syrus.desktop
productName: Syrus
directories:
  output: out
  buildResources: build
files:
  - assets/**/*
  - dist/**/*
  - dist-electron/**/*
  - package.json
# Staged by scripts/stage-backend-assets.mjs: install.sh + install.ps1,
# docker-compose.yml, compose.env.example, manifest.json (the backend image
# pin for this app version). Sealed by the code signature — never written to
# at runtime.
extraResources:
  - from: resources/backend
    to: backend
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # 512px master; a 1024px design asset would sharpen the Retina dock icon.
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # The Syrus CLI (pure-Go binaries staged by scripts/stage-cli.mjs).
  # Per-platform filters keep ~40 MB of the other OS's binaries out of each
  # package; Preferences installs from here — it powers the tray's Checkout
  # and terminal/agent workflows.
  extraResources:
    - from: resources/cli
      to: cli
      filter: ["syrus-darwin-*"]
  target:
    # zip is REQUIRED alongside dmg: electron-updater on macOS installs
    # updates from the zip, and latest-mac.yml references it.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Syrus ${version}
  iconSize: 128
  # Double-click install: one centered icon, no /Applications drag target —
  # the app copies itself into ~/Applications on first launch (see
  # electron/selfInstall.ts). Background is generated by
  # scripts/render-dmg-background.mjs (1x/2x combined via
  # `tiffutil -cathidpicheck`); its text positions assume the icon slot below.
  background: build/dmg-background.tiff
  window:
    width: 660
    height: 400
  contents:
    - x: 330
      y: 175
      type: file
# NSIS one-click, not MSI: electron-updater auto-updates NSIS installs but
# not MSI, and auto-update is what keeps the pinned backend image current.
# Per-user install (no admin), silent /S for fleets. Unsigned until the
# Authenticode cert lands — see docs/windows-desktop-plan.md.
win:
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  # Windows twin of the mac CLI FileSet above.
  extraResources:
    - from: resources/cli
      to: cli
      filter: ["syrus-win32-*"]
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Syrus
  # Brand the one-click UI: the setup exe's own icon, and the icon the
  # progress dialog (SpiderBanner) shows next to "Installing, please wait".
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Post-extraction guard: fail loudly (Defender guidance) instead of the
  # shell's "Missing Shortcut" dialog when the exe vanishes before launch.
  include: build/installer.nsh
linux:
  category: Development
  syncDesktopName: true
  target:
    - AppImage
# The auto-update feed. Baked into shipped apps (app-update.yml) — changing
# it later strands installed apps on the old feed.
publish:
  - provider: github
    owner: tkadauke
    repo: syrus
    # electron-builder defaults to DRAFT releases, which are invisible to
    # both auto-update and the website's releases/latest permalink.
    releaseType: release
