project:
  id: website
  label: Website
  kind: website

prepare:
  - npm ci

preview:
  start: npm run dev -- --hostname 0.0.0.0 --port $PORT
  health_check: /

visual_review:
  enabled: true
  rounds: 2
  when_files_changed:
    - "src/app/**/*"
    - "src/content/docs/**/*.md"
    - "src/content/blog/**/*.md"
    - "components/**/*"
    - "lib/blog.ts"
    - "lib/chrome.ts"
    - "lib/control-plane-copy.ts"
    - "lib/docs.ts"
    - "lib/locales.ts"
    - "lib/markdown.ts"
    - "lib/marketing.ts"
    - "lib/metadata.ts"
    - "lib/plugins.ts"
    - "lib/release.json"
    - "lib/release.ts"
    - "lib/site.ts"
    - "lib/sitemap.ts"
    - "public/**/*"
    - "next.config.ts"
    - "postcss.config.mjs"
  seed_notes: |
    Review the homepage at /, a representative documentation page such as
    /docs/dogfooding, the localized homepage at /de/, and representative blog
    index and article routes under /blog. Check both desktop and narrow mobile
    viewports, navigation, typography, content formatting, and image loading.

grade:
  - name: build
    description: |
      Builds the public Next.js website with committed release metadata
      instead of refreshing it from GitHub. This rejects stale source layouts,
      broken static export/type validation, and release-download page
      regressions before deploy workflows fail after merge, without dirtying
      grader workspaces when newer release metadata exists upstream.
    run: npm --prefix website ci && npm --prefix website run sync-release:check && npm --prefix website run build
    phases: [landing, ci]
    failures: allow_inherited
    base_retry:
      strategy: full_command
    required: true
    when_files_changed:
      - "**/*"
    deps:
      - "//:website-deploy-workflow"
    timeout_minutes: 10
