# Syrus's own .syrus.yml — picked up by Steps::Prepare in any
# workflow run against this repo (Initial / Replay / PrFeedback /
# CiFailure). The agent skips the dependency-install dance that
# tripped earlier runs (Job 166: ~25 turns spent figuring out how
# to make `bin/rspec` work because gems weren't installed).

prepare:
  # The agent's env strips BUNDLE_PATH (per Steps::Prepare's
  # PREP_ENV_FORWARD allowlist), but bundler defaults to a global
  # location otherwise. Pin install location to the workspace's
  # `vendor/bundle/` via a workspace-local `.bundle/config` so
  # `bin/rspec`, `bundle exec rails test`, etc. all resolve gems
  # the agent just installed.
  - bundle config set --local path vendor/bundle
  - bundle install --jobs 4

grade:
  # Reject migrations whose YYYYMMDDHHMMSS timestamps collide with
  # main or with each other. Hand-rolled timestamps silently corrupt
  # dev DBs (db:migrate skips colliding versions) and crash production
  # deploys with "table already exists". See CLAUDE.md "Migration
  # timestamps come from the generator" — the script fails the grade
  # so the loop nudges the agent to regenerate via the rails generator.
  - name: migration-collisions
    run: bin/check-migration-collisions
    timeout_minutes: 1

  - name: turbo-defaults
    run: bin/check-turbo-defaults
    timeout_minutes: 1

  # Full RSpec suite. CLAUDE.md "Tests are not optional" is the rule;
  # this grader is the enforcement. The agent gets push-back when a
  # spec fails — newly added behavior without coverage, OR a stale
  # spec left red by a refactor. The suite usually runs quickly, but
  # cold workers can spend nearly 5 minutes in RSpec itself; allow
  # enough margin for process shutdown too. `db:test:prepare` runs
  # first so schema changes landed in the same workflow are picked up
  # before spec collection.
  - name: rspec
    run: bin/rails db:test:prepare && bin/rspec
    timeout_minutes: 10

  # JS controller specs via `node --test`. Separate grader from
  # rspec so failures report distinctly — when the agent breaks a
  # Stimulus controller, the feedback says "js-tests failed" not
  # "rspec failed." Driven directly by node (no Rails boot, no
  # bundler), so ~100ms in practice; 1 minute is generous slack
  # for a cold worker. See CLAUDE.md "Tests" for why this lives
  # outside the RSpec suite.
  - name: js-tests
    run: bin/test-js
    timeout_minutes: 1
