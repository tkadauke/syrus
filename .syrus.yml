# Syrus's own .syrus.yml — picked up by Steps::Prepare in any
# workflow run against this repo (Initial / Replay / PrFeedback /
# CiFailure). The agent skips the dependency-install dance that
# tripped earlier runs (Job 166: ~25 turns spent figuring out how
# to make `bin/rspec` work because gems weren't installed). Keep
# Ruby and Node deps explicit here because the presence of this file
# disables RepoPrepPlan's lockfile auto-detection.

project:
  id: repo
  label: Syrus App
  kind: rails_app

prepare: &syrus_prepare
  # Syrus scrubs worker/container Bundler env before running prepare
  # and preview setup. Pin Bundler's install location to the workspace
  # so bare commands like `bin/rails` and `bin/rspec` resolve gems the
  # agent just installed.
  - bundle config set --local path vendor/bundle
  - bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}"
  - npm ci

formatters:
  - command: bundle exec rubocop -a
    files:
      - "**/*.rb"
      - "*.rb"
      - ".rubocop.yml"
  - command: npx eslint --fix app/frontend plugins/*/app/frontend
    files:
      - "app/frontend/**/*.ts"
      - "app/frontend/**/*.tsx"
      - "plugins/*/app/frontend/**/*.ts"
      - "plugins/*/app/frontend/**/*.tsx"
      - "eslint.config.js"
      - "eslint-rules/**/*.js"
  - command: npm run format:frontend:changed
    files:
      - "app/frontend/**/*.{ts,tsx,js,jsx,json,css,md,yml,yaml}"
      - "plugins/*/app/frontend/**/*.{ts,tsx,js,jsx,json,css,md,yml,yaml}"
      - "eslint-rules/**/*.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
  - command: gofmt -w cli plugins/*/cli plugins/*/container
    files:
      - "cli/**/*.go"
      - "plugins/*/cli/**/*.go"
      - "plugins/*/container/**/*.go"

targets:
  - name: website-deploy-workflow
    kind: default
    sources:
      - ".github/workflows/deploy-website.yml"

  # The core Ruby surface every bundled plugin builds on: the manifest DSL,
  # the extension-point contracts, and the registry that resolves them. Each
  # plugin's rspec grader depends on this, so changing a contract here selects
  # the plugins that implement it. Without it a plugin grader's only edges are
  # `//:repo` (no source scope, deliberately ignored by TargetGraph#affected)
  # and its sibling plugins, so a core-only change -- editing the very
  # extension point a plugin implements -- selected no plugin grader at all.
  #
  # Keep this narrow. It is the contract surface, not all of core: widening it
  # toward `app/**` would run every plugin's specs on nearly every PR.
  - name: plugin-api
    kind: library
    sources:
      - "lib/syrus/plugin.rb"
      - "lib/syrus/plugin_api.rb"
      - "lib/syrus/plugin/*.rb"
      - "lib/syrus/plugin/**/*.rb"
      - "lib/syrus/plugin_*.rb"
      - "lib/syrus/effect_scope.rb"
      - "lib/syrus/events.rb"
      - "lib/syrus/domain_event.rb"
      - "lib/syrus/kind_registry.rb"
      - "lib/syrus/metrics.rb"
      - "lib/syrus/metrics/*.rb"
      - "lib/syrus/metrics/**/*.rb"

preview:
  setup: *syrus_prepare
  start: bin/syrus-preview-dev
  seed: bin/rails db:prepare db:seed
  health_check: /up
  logs:
    - log/development.log
    - log/vite.log
    - log/tailwind.log
  env:
    RAILS_ENV: development
    SEARCH_DATABASE_PATH: storage/preview_search.sqlite3
  unset_env:
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - DB_HOST
    - SYRUS_DATABASE_PASSWORD
    - SYRUS_SQLITE

visual_review:
  enabled: true
  rounds: 2
  when_files_changed:
    - "app/frontend/**/*"
    - "app/views/**/*"
    - "plugins/**/app/frontend/**/*"
    - "plugins/**/app/views/**/*"
  seed_notes: |
    Log in as demo@syrus.local / password. Dashboard, Job/Epic detail,
    and chat are seeded. Live-updating panels (Job/Workflow progress,
    streaming transcripts) render as a static snapshot in preview because
    no background worker runs there by design — do not flag static
    progress as a defect. The "Inspect preview dashboard states" Job's
    Review tab has real fixture file/patch data (via Job#diff_fixture,
    development-only) even though the demo repo has no GitHub
    credentials — exercise the diff-review workspace there. The Source
    tab on that same Job still shows the "GitHub token not configured"
    empty state; that surface has no fixture yet.

hooks:
  post_checkout:
    - bundle check || bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}"
    - bundle exec rails db:migrate
    - git checkout -- db/schema.rb 2>/dev/null || true
    - git checkout -- db/structure.sql 2>/dev/null || true

adversarial_review:
  rounds: 1
  criteria:
    - |-
      If the diff adds or changes operator-facing behavior (AppSetting columns,
      .syrus.yml keys, step or trigger kinds, feature flags, MCP tools), verify
      that config/syrus_docs/ is updated in the same PR. If product-facing
      behavior changes, verify website/src/site-pages/ or
      website/src/content/docs/ is updated too, or the PR body explains why no
      update is needed.
    - |-
      If the diff adds new public methods, service classes, or step handlers,
      check whether the change includes corresponding spec additions or
      modifications. The rspec grader verifies the suite passes, but does not
      check whether new code paths are actually exercised by new examples.
    - |-
      Check for dead code and duplication: if the diff introduces a helper
      method, service class, or utility, search the codebase for existing
      methods that do the same thing and flag obvious copy-paste or parallel
      implementations.
    - |-
      If the diff introduces a case statement or if/elsif chain that branches
      on trigger_kind, job.kind, step.kind, or similar type attributes of
      domain objects, flag it. New per-kind behavior should be added to the
      corresponding handler class or registry (Workflow::TriggerKind,
      Step::Kind) rather than scattered as branches inside shared methods.
    - |-
      If new Workflow.create! or Run.create! calls appear in the diff, verify
      that user_id is derived from the parent Job's user, not hardcoded or
      inferred from a different source.
    - |-
      If config/features.yml is changed, verify that new or updated feature
      flag descriptions do not reference PR numbers, issue numbers, or phrases
      like "introduced in" or "added in" — descriptions must be timeless.
    - |-
      If the diff adds or changes any user-visible string in the SPA (a new
      i18next key, a modified translation value, or a new namespace entry),
      verify that the key is present in all three locale files:
      app/frontend/i18n/locales/en/, de/, and la/. Missing keys in de/ or la/
      silently fall back to English, so translation completeness is only
      enforceable by inspection. Flag any key present in en/ but absent from
      de/ or la/.

# Each grader's `description:` is surfaced in the UI (tooltip on the
# grader name + above the output panel on failure) and prepended to
# the per-grader block in the agent's grade-failure prompt. Authoring
# guidance: lead with what the grader rejects (so the agent knows what
# shape "passing" looks like), then mention the prod failure mode the
# check exists to prevent. Keep it 2-4 sentences; the surfaces this
# renders into don't have room for paragraphs.
grade:
  - name: migration-collisions
    description: |
      Rejects duplicate YYYYMMDDHHMMSS migration timestamps within each
      database namespace across the visible tree. The primary namespace
      includes app and plugin db/migrate paths; db/*_migrate paths are
      separate namespaces. Hand-rolled timestamps silently corrupt dev
      DBs and crash production deploys with "table already exists."
    run: bin/check-migration-collisions --all
    phases: [review, landing, ci]
    timeout_minutes: 1

  - name: migration-lint
    description: |
      Catches non-idempotent migration patterns (bare `add_column`,
      `remove_column`, `add_reference`, `add_index` without
      `_exists?` guards), integer foreign-key columns, post-policy
      database-level foreign keys, and MySQL-8 JSON-default footguns on
      migrations touched by this branch. Syrus intentionally uses indexed
      bigint/reference columns without DB-level FK constraints.
    run: bin/check-migrations
    phases: [review, landing, ci]
    timeout_minutes: 1

  - name: migration-baselines
    description: |
      Verifies primary database migrations work from scratch and from
      the schema snapshots represented by deployment tags (`staging`,
      `production`, and `public` by default). This catches deleted or
      reordered migrations that are invisible on a fully migrated dev
      database but crash deploys when an environment is still behind.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-primary-migration-baselines
    phases: [landing, ci]
    timeout_minutes: 10

  - name: thread-budget
    description: |
      Rejects a SolidQueue worker config whose thread budget exceeds
      the DB connection pool. Mismatch crashloops the worker pod at
      boot — it can't claim a connection per thread. Bump
      RAILS_MAX_THREADS / config/database.yml's pool, or trim the
      queue's thread count.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && bin/check-thread-budget
    phases: [review, landing, ci]
    # Landing dispatches graders in parallel; this one starts with the same
    # `bundle check` as eager-load/production-build-boot, so it needs the
    # same 3-minute headroom under contention instead of the tighter 1-minute
    # budget that produced a spurious exit-124 with zero actual failures.
    timeout_minutes: 3

  - name: feature-slugs
    description: |
      Ensures every Feature.enabled? call and frontend featureFlags
      reference uses a slug declared in config/features.yml. Undeclared
      slugs would silently stay disabled or disappear from the bootstrap
      payload, so feature rollout code must stay aligned with the YAML
      declaration.
    run: bin/check_feature_slugs
    phases: [review, landing, ci]
    required: true
    timeout_minutes: 1

  - name: frontend-lint
    description: |
      Runs the local design-system ESLint ratchet (eslint-rules/) over
      app/frontend and plugins/*/app/frontend. New raw form elements,
      hand-rolled button classes, legacy blue/terracotta tokens, raw
      gray/status colors, repeated panel shells, raw table markup, and
      overly long class strings fail beyond each file's checked-in
      baseline (eslint-rules/baseline.json); already-known debt stays
      green. See config/syrus_docs/design_system_eslint_ratchet.md.
    run: npm run lint
    phases: [review, landing, ci]
    when_files_changed:
      - "app/frontend/**/*.ts"
      - "app/frontend/**/*.tsx"
      - "plugins/*/app/frontend/**/*.ts"
      - "plugins/*/app/frontend/**/*.tsx"
      - "eslint.config.js"
      - "eslint-rules/**/*.js"
    timeout_minutes: 3

  - name: plugin-model-namespaces
    description: |
      Ensures plugin-owned Active Record models are namespaced and use
      namespace-prefixed table names. Plugin STI subclasses may share
      their core superclass table, but new plugin tables must be clearly
      owned by the plugin to avoid collisions once engine migrations are
      installed into the host app.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-plugin-model-namespaces
    phases: [review, landing, ci]
    required: true
    # Boots Rails before checking plugin-owned model classes. Under
    # shared-worker IO pressure, the app boot can exceed the tight
    # 1-minute budget even when the checker itself has no findings.
    timeout_minutes: 3

  - name: plugin-boundaries
    description: |
      Ensures core code never references a plugin, that plugin-to-plugin
      references are covered by a declared dependency, that every
      depends_on names an installed plugin, and that the dependency graph
      is acyclic. Core depending on a plugin is what makes a plugin
      undeletable, so this has to fail fast rather than surface as a
      mysterious boot error after someone removes a gem.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-plugin-boundaries
    phases: [review, landing, ci]
    required: true
    # Boots Rails to read the plugin registry, same as the model-namespace
    # checker; the 1-minute budget is too tight under IO pressure.
    timeout_minutes: 3

  - name: eager-load
    description: |
      Forces Rails.application.eager_load! to surface Zeitwerk
      duplicate-class / namespace-mismatch errors that lazy autoload
      in dev/test hides. These crashes only fire at production boot
      (when config.eager_load = true), so without this check they
      detonate live pods. If this fails, two files probably define
      the same constant with different superclasses — check umbrella
      files vs per-class siblings.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-eager-load
    phases: [review, landing, ci]
    # Same shared-worker contention as thread-budget/plugin-model-namespaces/
    # plugin-boundaries, plus this one also forces Zeitwerk to autoload every
    # file (heavier than a plain boot). Landing now runs enough concurrent
    # bundle-check graders that the 3-minute budget those got bumped to has
    # itself started producing spurious exit-124s here with zero eager-load
    # findings; 5 minutes matches the headroom already given to
    # fresh-production-db-prepare.
    timeout_minutes: 5

  - name: work-engine-simulations
    description: |
      Runs every deterministic WorkEngine simulation scenario in series.
      These fixtures replay stuck production-style states with mocked
      execution and must end in success or a declared waiting state, so
      scheduler/reconciler regressions surface before they block the
      landing queue for hours.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/simulator
    phases: [review, landing, ci]
    required: true
    timeout_minutes: 30
    # Intermittent worker/timing noise here has exhausted a landing attempt's
    # entire repair budget on a spotless 73/73 rerun more than once, with no
    # way for Syrus to tell "flaky today" apart from "genuinely broken" other
    # than rerunning the exact same command at the base revision. allow_inherited
    # (plus the base_retry default that comes with it for a custom grader --
    # see .syrus.yml docs) lets a failure that reproduces on base too pass
    # with a visible warning instead of blocking landing outright.
    failures: allow_inherited

  - name: production-build-boot
    description: |
      Boots the production Rails environment in Docker asset-precompile
      mode with build-only placeholder config and an intentionally dead
      DATABASE_URL. Asset precompile should load Rails without touching
      application tables; if an initializer performs DB work at build time,
      this grader fails before the production image build does.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-production-build-boot
    phases: [review, landing, ci]
    timeout_minutes: 3

  - name: fresh-production-db-prepare
    description: |
      Runs `db:prepare` into an empty production-style SQLite data root,
      including primary, cache, queue, cable, search, and plugin migrations.
      This catches deploy crashloops from historical migrations that reference
      current app models or renamed tables, which normal already-migrated test
      databases do not exercise.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs "${BUNDLE_INSTALL_JOBS:-1}" && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-fresh-production-db-prepare
    phases: [review, landing, ci]
    timeout_minutes: 5

  - type: rspec
    name: rspec
    description: |
      Full RSpec suite. CLAUDE.md "Tests are not optional" is the
      rule; this grader is the enforcement. New behavior needs new
      specs; bug fixes need regression specs; refactors must keep
      the suite green and add coverage to any under-tested area they touch.
      The Ruby plugin owns the RSpec commands, focused review selection,
      CI-only tag policy, JSON/JUnit output, and base-revision retry.
    failures: allow_inherited
    tags:
      ci:
        include:
          - ci_only
    parallel_rspec:
      enabled: true
      rspec_modes: [full, focused, ci]
      exec_args: bin/rspec-worker
      prepare_command: bundle exec rake parallel:prepare
    when_files_changed:
      - "app/**/*.rb"
      - "lib/**/*.rb"
      - "spec/**/*.rb"
    timeout_minutes: 60
    focused_timeout_minutes: 10
    ci_timeout_minutes: 60

  - type: vitest
    name: react-tests
    description: |
      React SPA tests and TypeScript typecheck. This is the main
      frontend regression gate after the SPA migration; it runs
      the repository typecheck script first, then Vitest. The JavaScript
      plugin owns full/focused/CI command synthesis, JUnit output, optional
      coverage, and base-revision retry.
    failures: allow_inherited
    coverage: true
    typecheck: true
    paths:
      - "app/frontend"
    when_files_changed:
      - "app/frontend/**/*.js"
      - "app/frontend/**/*.jsx"
      - "app/frontend/**/*.ts"
      - "app/frontend/**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
    timeout_minutes: 20
    focused_timeout_minutes: 20
    ci_timeout_minutes: 20

coverage:
  sources:
    - artifact: coverage/lcov.info
      format: lcov
    - artifact: coverage/js/lcov.info
      format: lcov
  threshold:
    lines: 70
  on_miss: warn
  pr_comment: true
  hitmap_ttl_days: 7

deployment_stages:
  - name: staging
    label: "On Staging"
    tag: staging
  - name: production
    label: "In Production"
    tag: production
  - name: public
    label: "Released to Public"
    tag: release
