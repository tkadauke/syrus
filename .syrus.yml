# Syrus's own .syrus.yml — picked up by Steps::Prepare in any
# workflow run against this repo (Initial / Replay / PrFeedback /
# CiFailure). The agent skips the dependency-install dance that
# tripped earlier runs (Job 166: ~25 turns spent figuring out how
# to make `bin/rspec` work because gems weren't installed). Keep
# Ruby and Node deps explicit here because the presence of this file
# disables RepoPrepPlan's lockfile auto-detection.

prepare: &syrus_prepare
  # Syrus scrubs worker/container Bundler env before running prepare
  # and preview setup. Pin Bundler's install location to the workspace
  # so bare commands like `bin/rails` and `bin/rspec` resolve gems the
  # agent just installed.
  - bundle config set --local path vendor/bundle
  - bundle install --jobs 4
  - npm ci

preview:
  setup: *syrus_prepare
  start: bin/rails server -p $PORT -b 0.0.0.0 -e development
  seed: bin/rails db:prepare db:seed
  health_check: /up
  logs:
    - log/development.log
  env:
    RAILS_ENV: development
    SEARCH_DATABASE_PATH: storage/preview_search.sqlite3
  unset_env:
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - DB_HOST
    - SYRUS_DATABASE_PASSWORD
    - SYRUS_SQLITE

visual_review:
  enabled: true
  rounds: 1
  when_files_changed:
    - "app/frontend/**/*"
    - "app/views/**/*"
    - "plugins/**/app/frontend/**/*"
    - "plugins/**/app/views/**/*"
  seed_notes: |
    Log in as demo@syrus.local / password. Dashboard, Job/Epic detail,
    and chat are seeded. Live-updating panels (Job/Workflow progress,
    streaming transcripts) render as a static snapshot in preview because
    no background worker runs there by design — do not flag static
    progress as a defect.

hooks:
  post_checkout:
    - bundle check || bundle install --jobs 4
    - bundle exec rails db:migrate
    - git checkout -- db/schema.rb 2>/dev/null || true
    - git checkout -- db/structure.sql 2>/dev/null || true

adversarial_review:
  rounds: 1
  criteria:
    - |-
      If the diff adds or changes operator-facing behavior (AppSetting columns,
      .syrus.yml keys, step or trigger kinds, feature flags, MCP tools), verify
      that config/syrus_docs/ is updated in the same PR. If product-facing
      behavior changes, verify website/src/site-pages/ or
      website/src/content/docs/ is updated too, or the PR body explains why no
      update is needed.
    - |-
      If the diff adds new public methods, service classes, or step handlers,
      check whether the change includes corresponding spec additions or
      modifications. The rspec grader verifies the suite passes, but does not
      check whether new code paths are actually exercised by new examples.
    - |-
      Check for dead code and duplication: if the diff introduces a helper
      method, service class, or utility, search the codebase for existing
      methods that do the same thing and flag obvious copy-paste or parallel
      implementations.
    - |-
      If the diff introduces a case statement or if/elsif chain that branches
      on trigger_kind, job.kind, step.kind, or similar type attributes of
      domain objects, flag it. New per-kind behavior should be added to the
      corresponding handler class or registry (Workflow::TriggerKind,
      Step::Kind) rather than scattered as branches inside shared methods.
    - |-
      If new Workflow.create! or Run.create! calls appear in the diff, verify
      that user_id is derived from the parent Job's user, not hardcoded or
      inferred from a different source.
    - |-
      If config/features.yml is changed, verify that new or updated feature
      flag descriptions do not reference PR numbers, issue numbers, or phrases
      like "introduced in" or "added in" — descriptions must be timeless.
    - |-
      If the diff adds or changes any user-visible string in the SPA (a new
      i18next key, a modified translation value, or a new namespace entry),
      verify that the key is present in all three locale files:
      app/frontend/i18n/locales/en/, de/, and la/. Missing keys in de/ or la/
      silently fall back to English, so translation completeness is only
      enforceable by inspection. Flag any key present in en/ but absent from
      de/ or la/.

# Each grader's `description:` is surfaced in the UI (tooltip on the
# grader name + above the output panel on failure) and prepended to
# the per-grader block in the agent's grade-failure prompt. Authoring
# guidance: lead with what the grader rejects (so the agent knows what
# shape "passing" looks like), then mention the prod failure mode the
# check exists to prevent. Keep it 2-4 sentences; the surfaces this
# renders into don't have room for paragraphs.
grade:
  - name: migration-collisions
    description: |
      Rejects migrations whose YYYYMMDDHHMMSS timestamps collide with
      main or with each other. Hand-rolled timestamps silently corrupt
      dev DBs (db:migrate skips colliding versions) and crash production
      deploys with "table already exists." Always create migrations
      via `bin/rails generate migration <Name>` so the timestamp is
      fresh at file-creation time.
    run: bin/check-migration-collisions
    phases: [review, landing, ci]
    timeout_minutes: 1

  - name: migration-lint
    description: |
      Catches non-idempotent migration patterns (bare `add_column`,
      `remove_column`, `add_reference`, `add_index` without
      `_exists?` guards) and MySQL-8 JSON-default footguns on
      migrations touched by this branch. Production deploys retry
      partial migrations; without guards the retry crashes with
      "Duplicate column" or "table already exists."
    run: bin/check-migrations
    phases: [review, landing, ci]
    timeout_minutes: 1

  - name: migration-baselines
    description: |
      Verifies primary database migrations work from scratch and from
      the schema snapshots represented by deployment tags (`staging`,
      `production`, and `public` by default). This catches deleted or
      reordered migrations that are invisible on a fully migrated dev
      database but crash deploys when an environment is still behind.
    run: bin/check-primary-migration-baselines
    phases: [landing, ci]
    timeout_minutes: 10

  - name: thread-budget
    description: |
      Rejects a SolidQueue worker config whose thread budget exceeds
      the DB connection pool. Mismatch crashloops the worker pod at
      boot — it can't claim a connection per thread. Bump
      RAILS_MAX_THREADS / config/database.yml's pool, or trim the
      queue's thread count.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && bin/check-thread-budget
    phases: [review, landing, ci]
    # Landing dispatches graders in parallel; this one starts with the same
    # `bundle check` as eager-load/production-build-boot, so it needs the
    # same 3-minute headroom under contention instead of the tighter 1-minute
    # budget that produced a spurious exit-124 with zero actual failures.
    timeout_minutes: 3

  - name: feature-slugs
    description: |
      Ensures every Feature.enabled? call and frontend featureFlags
      reference uses a slug declared in config/features.yml. Undeclared
      slugs would silently stay disabled or disappear from the bootstrap
      payload, so feature rollout code must stay aligned with the YAML
      declaration.
    run: bin/check_feature_slugs
    phases: [review, landing, ci]
    required: true
    timeout_minutes: 1

  - name: plugin-model-namespaces
    description: |
      Ensures plugin-owned Active Record models are namespaced and use
      namespace-prefixed table names. Plugin STI subclasses may share
      their core superclass table, but new plugin tables must be clearly
      owned by the plugin to avoid collisions once engine migrations are
      installed into the host app.
    run: bin/check-plugin-model-namespaces
    phases: [review, landing, ci]
    required: true
    timeout_minutes: 1

  - name: eager-load
    description: |
      Forces Rails.application.eager_load! to surface Zeitwerk
      duplicate-class / namespace-mismatch errors that lazy autoload
      in dev/test hides. These crashes only fire at production boot
      (when config.eager_load = true), so without this check they
      detonate live pods. If this fails, two files probably define
      the same constant with different superclasses — check umbrella
      files vs per-class siblings.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-eager-load
    phases: [review, landing, ci]
    timeout_minutes: 3

  - name: production-build-boot
    description: |
      Boots the production Rails environment in Docker asset-precompile
      mode with build-only placeholder config and an intentionally dead
      DATABASE_URL. Asset precompile should load Rails without touching
      application tables; if an initializer performs DB work at build time,
      this grader fails before the production image build does.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/check-production-build-boot
    phases: [review, landing, ci]
    timeout_minutes: 3

  - name: rspec
    description: |
      Full RSpec suite. CLAUDE.md "Tests are not optional" is the
      rule; this grader is the enforcement. New behavior needs new
      specs; bug fixes need regression specs; refactors must keep
      the suite green and add coverage to any under-tested area
      they touch. `bin/rspec-fast` prepares the test databases
      itself, so schema changes in the same workflow are picked up
      before spec collection. This grader runs during landing, after
      the operator has approved the PR.
    # RspecJunitFormatter (not SyrusRails::RspecParser's native progress-text
    # parsing) is used deliberately: the native parser only enumerates
    # *failing* examples, so a test can never show up with both a passed and
    # a failed row — which is exactly what TestCase.top_flaky_tests requires
    # to flag a test as flaky. See config/syrus_docs/test_insights.md.
    # bin/rspec-fast merges its per-worker JUnit XML into this single path so
    # ingestion works under parallelism.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" RSPEC_PROCESSES="${RSPEC_PROCESSES:-4}" bin/rspec-fast
    phases: [landing]
    junit_output: .syrus/grade-output/rspec-junit.xml
    failures: allow_inherited
    # Processes default to 4, matching the worker pods' visible CPU count
    # (`nproc` is 4 and JOB_CONCURRENCY lets three Runs share a pod). Each
    # process pays its own Rails boot and its own test database, so more of
    # them costs more total CPU, not less: measured over the whole suite,
    # 8 processes burn 455 CPU-seconds against 352 at 4. On an idle
    # many-core laptop 8 still wins on wall clock, which is why
    # bin/rspec-fast keeps that default for local runs.
    #
    # 30 assumed 4-way parallelism alone gives enough margin, but that
    # ignores host contention: with up to three Runs sharing one 4-core
    # pod (see the nproc note above), this grader's 4 rspec-fast workers
    # can end up fighting other Runs' workers for the same cores. Observed
    # in production: 3 of 4 workers finished in 21-24 minutes while the
    # 4th was still running at the 30-minute mark (2725/2901/2573 examples
    # each, evenly split -- not a hang, just contention-driven skew), so
    # the whole grader exit-124'd with 0 actual failures. Bumped for
    # headroom, same reasoning as the 30->75 serial bump this replaced.
    #
    # 45 recurred: the suite has grown since the last bump, and 3 of 4
    # workers finished in 41-42 minutes (0 failures) while the 4th was
    # still running past the 45-minute mark under the same host-contention
    # pattern. Bumped again with the same absolute margin (~15-18 minutes
    # past the observed slowest-finishing workers) rather than shrinking
    # parallelism, since fewer processes cost more total CPU (see above).
    timeout_minutes: 60

  - name: rspec-focused
    description: |
      Runs only the RSpec files covering the diff so far (changed spec
      files plus the conventional spec for each changed app/lib source
      file) on every review-phase grade iteration. Fast feedback loop —
      the full suite still runs at landing via the `rspec` grader.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bin/rspec-focused
    phases: [review]
    when_files_changed: ["app/**/*.rb", "lib/**/*.rb", "spec/**/*.rb", "plugins/**/*.rb"]
    junit_output: .syrus/grade-output/rspec-focused-junit.xml
    failures: allow_inherited
    timeout_minutes: 10

  - name: rspec-ci
    description: |
      Full GitHub Actions-equivalent RSpec suite, including specs tagged
      :ci_only. This runs only when Syrus is fixing a CI failure or judging
      main-branch health, not during ordinary review or landing.
    run: BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle check || BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" bundle install --jobs 4 && BUNDLE_PATH="$PWD/vendor/bundle" BUNDLE_APP_CONFIG="$PWD/.bundle" RSPEC_PROCESSES="${RSPEC_PROCESSES:-4}" bin/rspec-ci
    phases: [ci]
    junit_output: .syrus/grade-output/rspec-junit.xml
    failures: allow_inherited
    timeout_minutes: 30

  - name: react-tests
    description: |
      React SPA tests and TypeScript typecheck. This is the main
      frontend regression gate after the SPA migration; it runs
      Vitest and `tsc --noEmit` concurrently through `bin/test-react`.
      Failures here usually mean the rendered app/API contract or
      typed frontend model drifted. Vitest alone now runs close to the
      old 15-minute budget as the suite has grown, leaving no room for
      `tsc --noEmit` even running concurrently; bumped for headroom.
    run: bin/test-react
    phases: [landing, ci]
    junit_output: .syrus/grade-output/react-tests-junit.xml
    failures: allow_inherited
    timeout_minutes: 20

  - name: react-tests-focused
    description: |
      Runs only the Vitest tests related (via Vitest's native module-graph
      `related` resolution) to the diff so far, on every review-phase
      grade iteration. Fast feedback loop — the full suite + typecheck
      still run at landing/ci via the `react-tests` grader.
    run: bin/test-react-focused
    phases: [review]
    when_files_changed: ["app/frontend/**/*.ts", "app/frontend/**/*.tsx", "plugins/**/app/frontend/**/*.ts", "plugins/**/app/frontend/**/*.tsx", "desktop/src/**/*.ts", "desktop/src/**/*.tsx"]
    junit_output: .syrus/grade-output/react-tests-focused-junit.xml
    failures: allow_inherited
    timeout_minutes: 10

  - name: website-build
    description: |
      Builds the public Next.js website exactly like the GitHub Pages
      deploy workflow. This rejects stale source layouts, broken static
      export/type validation, and release-download page regressions
      before `.github/workflows/deploy-website.yml` fails after merge.
    run: npm --prefix website ci && npm --prefix website run sync-release && npm --prefix website run build
    phases: [landing, ci]
    failures: allow_inherited
    required: true
    timeout_minutes: 10

coverage:
  sources:
    - artifact: coverage/lcov.info
      format: lcov
    - artifact: coverage/js/lcov.info
      format: lcov
  threshold:
    lines: 70
  on_miss: warn
  pr_comment: true
  hitmap_ttl_days: 7

deployment_stages:
  - name: staging
    label: "On Staging"
    tag: staging
  - name: production
    label: "In Production"
    tag: production
  - name: public
    label: "Released to Public"
    tag: release
