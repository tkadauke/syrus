plugin: coworkers

# This ownership declaration inventories terms whose semantics disappear when
# the plugin is absent. Compatibility entries below are a shadow-mode baseline:
# differences are reported for visibility but do not fail required checks or
# require count updates. Enforcement requires a later explicit operator choice.
ownership:
  configuration_keys:
    - coworker_review
  step_kinds:
    - coworker_review
    - coworker_run
  target_types:
    - coworker
  route_prefixes:
    - /api/v1/app/coworkers
  tables:
    - coworker_chats
    - coworker_grants
    - coworker_provisioning_attempts
    - coworker_review_contexts
    - coworker_workspace_conflicts
    - coworker_workspace_repositories
    - coworkers
    - coworkers_chat_agents
  problem_codes:
    - coworker_memory_persistence_failed
    - coworker_review_target_required
  tools:
    - delete_coworker_file
    - discover_coworker_capabilities
    - edit_coworker_file
    - list_coworker_grants
    - list_coworkers
    - manage_coworker_schedule
    - message_coworker
    - move_coworker_file
    - propose_coworker
    - propose_coworker_grants
    - read_coworker
    - spawn_coworker_chat
    - submit_coworker_review
    - update_coworker_review_memory
    - write_coworker_file
  frontend_contributions:
    - coworkers/Coworkers
    - coworkers tool cards
  documentation_paths:
    - plugins/coworkers/docs
  vocabulary:
    - coworker
    - coworkers

