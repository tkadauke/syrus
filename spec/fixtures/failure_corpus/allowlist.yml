    - d837875c7de1-58d75f84606a9e96
    - e24bfe746fa3-8ebb93ad62fc60dd
    - e24bfe746fa3-9b9029a8cd5179db
    - e3322097a1a0-c921127b6bb2f948
    - eb2a243e2075-5884b8b9dd6b4b8f
    - eb2a243e2075-cf1e88c70eda2beb

- status: unreviewed
  to: schema_version_skew/retryable
  reason: >-
    A missing table or column ("Table '...' doesn't exist") is now retryable
    schema_version_skew: a Run still on the previous release right after a
    deploy migrated. Matches the commit that added the classification; not
    one of the fixes this allowlist was seeded with, so it awaits review.
  cases:
    - a9181beed9ea-71c550ae57be2fe3
    - c37a5c04b380-ba19ee9601db3ae7
    - cc4a0544711d-943a5f640dece12b

- status: unreviewed
  to: prepare_network_transient/retryable
  reason: >-
    An immutable-source `npm ci` that failed with ECONNRESET is now a
    retryable prepare_network_transient. It used to read as
    provider_auth_or_config because "webauthn" in the install log matched a
    bare `auth`. Matches the commits that narrowed the auth pattern and
    called registry blips transient; awaits review.
  cases:
    - 8c865d05fcdf-8bca6791ea0678c5

- status: unreviewed
  to: recheck:retry
  reason: >-
    AutoRetryJob's retryability recheck no longer skips a reconciler-planned
    retry of a pr_open whose PR branch diverged: that repair is a retry from
    the current branch (REPAIRED_BY_RETRY_CLASSIFICATIONS). Production
    skipped all three attempts here and the Job sat failed. This is the fix
    for the diverged-branch regression; awaits review.
  cases:
    - 30c5cad992e5-451c5e655700f63a

- status: suspected_regression
  to: grader_failure/final
  reason: >-
    The work engine declared these Runs workspace_recovery_failed (retryable,
    confidence 1.0) when it could not recover the workspace, killing a grader
    mid-run. Re-classifying them (RunFailureClassifier.persist!, which
    AutoRetryJob's recheck calls) finds the killed grader's
    "grader X failed" diagnostic and overwrites the repair's verdict with a
    non-retryable grader_failure, so the recheck skips the retry the repair
    scheduled. persist! only defers to a confident verdict over the
    "unclassified" fallback, not over a weaker inference. Production shows
    the same skip ("failure is not retryable: grader_failure (was
    workspace_recovery_failed)"). Pre-existing, not introduced by a recent
    change; acknowledged so new drift still fails.
  cases:
    - 013579706c13-9327310731d27449
    - 0df4c9093b7b-b4b382c978d3e121
    - 169c2d19a8f0-b4b382c978d3e121
