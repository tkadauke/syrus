name: auto retry budget exhausts then stops
runner:
  # Isolate the AutoRetryAttempt budget path: the harness's own per-tick
  # failed-job retry would otherwise retry forever outside any budget.
  # Note worker_died carries its own larger budget (MAX_WORKER_DIED_ATTEMPTS)
  # and is exempt from the identical-failure budget (the retry runs on another
  # worker), so this scenario fails with timeouts.
  auto_retry_failed_jobs: false
jobs:
  first:
    title: First job
    state: queued
    workflow:
      template: true
      kind: initial
outcomes:
  default: success
  steps:
    implement:
      - status: failure
        error_class: Timeout::Error
        error_message: execution expired
expect:
  jobs:
    first:
      - failed
  queues:
    active_runs: empty
    active_work_units: empty
  run_evidence:
    # A deterministic timeout used to fail twelve times: three in-place
    # reruns per workflow attempt times four attempts, each loop on its own
    # budget. The two loops now share one budget per (step, fingerprint):
    # an in-place rerun that fails exactly like the run before it hands over
    # to a fresh workflow, and nothing retries once the step has failed that
    # way Runs::RepeatedFailure::MAX_IDENTICAL_FAILURES (4) times.
    - job: first
      step: implement
      state: failed
      count: 4
  events:
    # One fresh-workflow retry ran, then the reconciler named the hold
    # instead of scheduling a second.
    - "auto retry 1"
    - "operator_review_retry_budget_exhausted"
  absent_events:
    - "auto retry 2"
# No invariants: expected block. The policy stops below retry_storms'
# threshold (more than 5 identical failures), so every invariant must hold.
