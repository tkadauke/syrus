# Found by the simulator fuzzer (bin/simulator --fuzz --seed 6, iteration 58,
# shrunk to one event) on happy_path_job_dependency_dag_lands: a transient
# git failure on the root sends its landing through a rebase. The rebase's
# after_success hook launched the auto_merge landing inside the rebase's
# success transition, locking the new landing's WorkIntent and WorkUnit
# while holding the rebase Workflow -- out of the row-lock order (NY40). The
# hook now re-dispatches after the transaction commits.
name: rebase success relands a dependency DAG in lock order
repository:
  owner: simulation
  name: rebase-success-relands-a-dependency-dag-in-lock-order
  auto_merge_enabled: true
jobs:
  root:
    title: Root job
    state: queued
    workflow:
      template: true
      kind: initial
  left:
    title: Left child
    state: queued
    depends_on:
    - root
    workflow:
      template: true
      kind: initial
  right:
    title: Right child
    state: queued
    depends_on:
    - root
    workflow:
      template: true
      kind: initial
  leaf:
    title: Leaf job
    state: queued
    depends_on:
    - left
    - right
    workflow:
      template: true
      kind: initial
events:
- name: approve root once implemented
  once: true
  when:
    job:
      id: root
      state: implemented
  do:
    approve: root
- name: approve left once implemented
  once: true
  when:
    job:
      id: left
      state: implemented
  do:
    approve: left
- name: approve right once implemented
  once: true
  when:
    job:
      id: right
      state: implemented
  do:
    approve: right
- name: approve leaf once implemented
  once: true
  when:
    job:
      id: leaf
      state: implemented
  do:
    approve: leaf
- name: injected transient_failure
  once: true
  when:
    tick:
      at_least: 12
  do:
    inject_outcome:
      job: root
      outcome:
        status: failure
        failure_code: git_transport_transient
        error_message: simulated transient git_transport_transient
outcomes:
  default: success
expect:
  jobs:
    root:
    - closed
    left:
    - closed
    right:
    - closed
    leaf:
    - closed
  queues:
    active_runs: empty
    active_work_units: empty
    landing: empty
