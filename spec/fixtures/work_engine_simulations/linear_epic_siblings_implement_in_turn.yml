name: linear epic siblings implement in turn
repository:
  owner: simulation
  name: linear-epic-siblings-implement-in-turn
epics:
  feature:
    title: Serialized sibling jobs
jobs:
  alpha:
    title: Alpha job
    epic: feature
    state: queued
    workflow:
      template: true
      kind: initial
  beta:
    title: Beta job
    epic: feature
    state: queued
    workflow:
      template: true
      kind: initial
  gamma:
    title: Gamma job
    epic: feature
    state: queued
    workflow:
      template: true
      kind: initial
events:
  - name: retry beta after alpha implementation finishes
    once: true
    when:
      job:
        id: alpha
        state: implemented
    do:
      resume_deferred_phase:
        job: beta
  - name: retry gamma after beta implementation finishes
    once: true
    when:
      job:
        id: beta
        state: implemented
    do:
      resume_deferred_phase:
        job: gamma
outcomes:
  default: success
success_states:
  alpha:
    - implemented
  beta:
    - implemented
  gamma:
    - implemented
