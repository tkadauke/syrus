# A worker without the zstd client library cannot link mysql2, so the
# repository's `bundle install` fails there -- and passes on any correctly
# provisioned worker. That is a worker defect, not a failure of the change:
# prepare declares worker_environment_missing, the worker is recorded as
# unable to run this repository's install, and the step is retried in place
# on another worker. The Job never fails and no repair runs.
#
# The retry is pinned to the unprovisioned worker in the outcome, modelling
# it claiming the Run from the shared queue first; placement must hand it to
# the provisioned worker instead.
name: worker environment missing prepare reroutes
max_ticks: 60
repository:
  owner: simulation
  name: worker-environment-missing-prepare-reroutes
runtime:
  workers:
    - worker-unprovisioned
    - worker-provisioned
runner:
  auto_retry_failed_jobs: false
jobs:
  needs_zstd:
    title: mysql2 links zstd
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
outcomes:
  default: success
  steps:
    prepare:
      - status: failure
        worker: worker-unprovisioned
        problem_code: worker_environment_missing
        problem_evidence:
          missing_kind: library
          missing_name: zstd
          command: bundle install
        error_message: "prepare command failed (exit 5): bundle install\nOutput tail:\nld: library 'zstd' not found\nAn error occurred while installing mysql2 (0.5.7), and Bundler cannot continue."
      - status: success
        worker: worker-unprovisioned
expect:
  jobs:
    needs_zstd:
      - implemented
  run_evidence:
    - job: needs_zstd
      step: prepare
      classification: worker_environment_missing
  events:
    - "placement avoided"
  absent_events:
    - "retry_workflow"
success_states:
  needs_zstd:
    - implemented
