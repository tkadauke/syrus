# An urgent job whose checks keep failing cannot land and cannot leave
# `approved`, so under the old bare-existence gate it blocked every
# non-urgent job in its repository for as long as it sat there. The engine
# has to resolve this on its own: fixing the checks is operator work, and
# nothing else in the system was going to move first.
name: stalled urgent job stops starving non-urgent work
repository:
  owner: simulation
  name: stalled-urgent-job-does-not-starve-repository
  auto_merge_enabled: true
jobs:
  stalled_urgent:
    title: Urgent fix whose checks never pass
    state: approved
    priority: urgent
    branch_name: syrus/direct-stalled-urgent
    pr_number: 6801
    pr_checks_state: failing
    pr_checks_sha: dddddddddddddddddddddddddddddddddddddddd
    pr_checks_base_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    mergeability_head_sha: dddddddddddddddddddddddddddddddddddddddd
    mergeability_base_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    mergeability_checked_at: "2099-01-01 00:00:00"
    github_mergeable_state: unstable
    github_mergeable: true
    commits_behind_base: 0
    approved_at: "2026-10-31 09:00:00"
    approved_via: operator
    # Well past UrgentWorkGate::STALLED_AFTER, and with no active workflow, so
    # the gate has to judge it stalled on its own evidence. The loader writes
    # jobs with update_columns and records no StateTransition, so created_at
    # is what the gate falls back to here.
    created_at: "2026-10-31 08:00:00"
    updated_at: "2026-10-31 09:00:00"
  starved_initial:
    title: Ordinary work starved by the urgent gate
    state: queued
    priority: medium
    created_at: "2026-10-31 09:05:00"
    workflow:
      kind: initial
      state: queued
      created_at: "2026-10-31 09:05:00"
      artifacts:
        start_blocked_reason: urgent_job_active
        # Far-future, like the sibling urgent-landing scenario: the block must
        # clear because the gate reopens, not because a backoff expired.
        start_blocked_next_check_at: "2099-01-01T00:00:00Z"
      work_unit:
        state: blocked
        blocked_reason: urgent_job_active
        blocked_details:
          start_blocked_reason: urgent_job_active
        from_definition: true
      steps:
        - kind: prepare
          state: queued
        - kind: implement
          state: queued
outcomes:
  default: success
expect:
  jobs:
    # Keeps its failing checks and stays approved: making the checks pass is
    # an operator action, not something the engine can resolve. What matters
    # is that it stops holding everyone else back.
    stalled_urgent:
      - approved
    starved_initial:
      - implemented
  queues:
    # Not `landing: empty`: that asserts Job.landing_queue (approved +
    # landing) is empty, and stalled_urgent stays approved on purpose.
    active_runs: empty
    active_work_units: empty
