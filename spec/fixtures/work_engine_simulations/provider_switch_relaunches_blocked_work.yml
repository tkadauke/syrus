name: provider switch relaunches blocked work
user:
  agent_provider: codex
repository:
  owner: simulation
  name: provider-switch-relaunch
jobs:
  first:
    title: First job
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
events:
  # Exhausted BEFORE the first admission: the ProviderAvailability gate runs
  # at admission, so work already in flight is never re-gated.
  - name: exhaust codex usage before the first admission
    once: true
    when:
      job:
        id: first
        state: queued
    do:
      exhaust_provider_usage: codex
  - name: switch job to alternate provider once the unit is provider-blocked
    once: true
    when:
      work_unit:
        job: first
        blocked_reason: provider_availability
    do:
      set_job_provider:
        job: first
        provider: alternate
outcomes:
  default: success
expect:
  jobs:
    first:
      - implemented
  queues:
    active_runs: empty
    active_work_units: empty
  events:
    # The gate must actually have engaged and the switch must actually have
    # released the blocked unit -- otherwise a job that simply ran would pass.
    # (StaleProviderRelauncher's preemption path, which this scenario used to
    # reach only because the simulator re-admitted work every tick, is covered
    # end-to-end in spec/services/work_engine/reconciler_spec.rb.)
    - "event exhaust codex usage before the first admission"
    - "switched JOB"
    - "1 deferred phases resumed"
