name: provider auth error pauses then resumes
user:
  agent_provider: codex
repository:
  owner: simulation
  name: provider-auth-pause-then-resume
jobs:
  first:
    title: First job
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
  second:
    title: Second job
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
events:
  # Broken BEFORE the first admission, not after the workflows are already
  # running. The ProviderAvailability gate runs when work is admitted
  # (WorkDefinitions::Base), so an in-flight workflow is never re-gated and
  # breaking auth mid-flight pauses nothing.
  - name: break codex auth before the first admission
    once: true
    when:
      any:
        - job:
            id: first
            state: queued
        - job:
            id: second
            state: queued
    do:
      set_provider_status:
        provider: codex
        status: auth_error
  - name: restore codex auth once units are provider-blocked
    once: true
    when:
      any:
        - work_unit:
            job: first
            blocked_reason: provider_availability
        - work_unit:
            job: second
            blocked_reason: provider_availability
    do:
      refresh_provider_usage: codex
  - name: wake provider admission once auth is restored
    once: true
    when:
      any:
        - work_unit:
            job: first
            blocked_reason: provider_availability
        - work_unit:
            job: second
            blocked_reason: provider_availability
    do:
      wake_provider_admission: codex
outcomes:
  default: success
expect:
  jobs:
    first:
      - implemented
    second:
      - implemented
  queues:
    active_runs: empty
    active_work_units: empty
  events:
    # The pause must have engaged and the wake must have admitted both blocked
    # workflows -- without a count, jobs succeeding would pass even if the gate
    # never engaged and the wake resumed nothing.
    - "event break codex auth before the first admission"
    - "provider admission wakeup: 2 workflows"
