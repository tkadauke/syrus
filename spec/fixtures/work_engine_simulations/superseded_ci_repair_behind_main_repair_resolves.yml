name: superseded CI repair held behind a main repair resolves
repository:
  owner: simulation
  name: superseded-ci-repair-behind-main-repair
  auto_merge_enabled: true
  main_branch_health_enabled: true
main_branch_health_checks:
  - sha: current-base-sha
    checked_at: "2026-09-20 10:00:00"
    ci_health: healthy
    grader_health: healthy
jobs:
  job:
    title: CI repair held behind a main repair of an obsolete base
    state: approved
    priority: medium
    branch_name: syrus/direct-superseded-ci-repair-behind-main-repair
    pr_number: 6502
    approved_at: "2026-09-20 10:00:00"
    pr_checks_state: failing
    pr_checks_sha: head-sha
    pr_checks_base_sha: current-base-sha
    pr_checks_failing_names:
      - rails-test
    workflow:
      kind: ci_failure
      created_at: "2026-09-20 09:55:00"
      artifacts:
        base_sha: stale-base-sha
        head_sha: head-sha
      work_unit:
        state: blocked
        blocked_reason: ci_repair_safety
        blocked_until: "2026-09-20 10:05:00"
        blocked_details:
          kind: base_repair_active
          base_sha: stale-base-sha
          repair_trigger_kind: main_branch_repair
      steps:
        - kind: prepare
          state: queued
outcomes:
  default: success
expect:
  jobs:
    job:
      - approved
  queues:
    active_runs: empty
    active_work_units: empty
  events:
    - cancel_superseded_ci_repair
