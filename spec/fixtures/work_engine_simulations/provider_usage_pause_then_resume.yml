name: provider usage exhaustion pauses then resumes
user:
  agent_provider: codex
repository:
  owner: simulation
  name: provider-usage-pause-then-resume
jobs:
  first:
    title: First job
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
  second:
    title: Second job
    state: queued
    agent_provider: codex
    workflow:
      template: true
      kind: initial
events:
  # Exhausted BEFORE the first admission: the ProviderAvailability gate runs
  # at admission, so work already in flight is never re-gated.
  - name: exhaust codex usage before the first admission
    once: true
    when:
      any:
        - job:
            id: first
            state: queued
        - job:
            id: second
            state: queued
    do:
      exhaust_provider_usage: codex
  - name: refresh codex usage once units are provider-blocked
    once: true
    when:
      any:
        - work_unit:
            job: first
            blocked_reason: provider_availability
        - work_unit:
            job: second
            blocked_reason: provider_availability
    do:
      refresh_provider_usage: codex
  - name: wake provider admission once usage is refreshed
    once: true
    when:
      any:
        - work_unit:
            job: first
            blocked_reason: provider_availability
        - work_unit:
            job: second
            blocked_reason: provider_availability
    do:
      wake_provider_admission: codex
outcomes:
  default: success
expect:
  jobs:
    first:
      - implemented
    second:
      - implemented
  queues:
    active_runs: empty
    active_work_units: empty
  events:
    # The pause must have engaged and the wake must have admitted both
    # blocked workflows -- without a count, jobs succeeding would pass even if
    # the gate never engaged and the wake resumed nothing.
    - "event exhaust codex usage before the first admission"
    - "provider admission wakeup: 2 workflows"
