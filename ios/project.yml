# XcodeGen spec — the source of truth for Syrus.xcodeproj.
# Regenerate with `xcodegen generate` after adding/removing files or changing
# settings; the generated project is committed so Xcode and CI can build it
# without XcodeGen installed.
name: Syrus
options:
  bundleIdPrefix: dev.syrus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Syrus:
    type: application
    platform: iOS
    sources:
      - path: Syrus
    info:
      path: Syrus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Syrus
        UILaunchScreen: {}
        SyrusAPNSEnvironment: $(SYRUS_APNS_ENVIRONMENT)
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Operators point the app at self-hosted servers that are often plain
        # HTTP on a LAN or tailnet, so local-network HTTP is allowed. HTTPS
        # remains the default for any non-private host (see ServerURL).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: Syrus/Resources/Syrus.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.syrus.ios
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Syrus/Resources/Syrus.entitlements
      configs:
        Release:
          # Release builds register with the production APNs environment.
          SYRUS_APNS_ENVIRONMENT: production
        Debug:
          SYRUS_APNS_ENVIRONMENT: sandbox
  SyrusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SyrusTests
    dependencies:
      - target: Syrus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.syrus.ios.tests
schemes:
  Syrus:
    build:
      targets:
        Syrus: all
        SyrusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SyrusTests
