# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

default: &default
  poll_repositories:
    class: PollAllRepositoriesJob
    schedule: every 5 minutes
  poll_pull_requests:
    class: PollAllPullRequestsJob
    schedule: every 5 minutes
  poll_merge_states:
    class: PollAllMergeStatesJob
    schedule: every 5 minutes
  poll_scheduled_tasks:
    class: PollScheduledTasksJob
    schedule: every minute
  recurring_task_tick:
    class: RecurringTaskTickJob
    schedule: every minute
  reap_stale_runs:
    class: ReapStaleRunsJob
    schedule: every minute
  reap_awaiting_operator_runs:
    class: ReapAwaitingOperatorRunsJob
    schedule: every hour
  nudge_awaiting_operator_runs:
    class: OperatorQuestionNudgeJob
    schedule: every hour
  prune_claude_sessions:
    class: ClaudeSessionPruneJob
    schedule: every day at 3:00am
  prune_run_diagnostics:
    class: RunDiagnosticPruneJob
    schedule: every day at 3:10am
  prune_workflow_workspaces:
    class: WorkflowWorkspacePruneJob
    schedule: every 2 hours
  sync_agent_skills:
    class: SyncAgentSkillsJob
    schedule: every hour
  sync_installations:
    class: SyncInstallationsJob
    schedule: every 5 minutes

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    class: SolidQueueCleanupJob
    schedule: every hour at minute 12
