# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

default: &default
  poll_input_sources:
    class: PollAllInputSourcesJob
    queue: polling
    schedule: every 5 minutes
  poll_main_branch_health:
    class: PollAllMainBranchHealthJob
    queue: polling
    schedule: every 5 minutes
  poll_pull_requests:
    class: PollAllPullRequestsJob
    queue: polling
    schedule: every 5 minutes
  poll_external_open_prs:
    class: PollAllExternalOpenPrsJob
    queue: polling
    schedule: every 5 minutes
  poll_merge_states:
    class: PollAllMergeStatesJob
    queue: polling
    schedule: every 5 minutes
  poll_deployment_stages:
    class: PollAllDeploymentStagesJob
    queue: polling
    schedule: every 5 minutes
  process_landing_queue:
    class: LandingQueueProcessorJob
    queue: control_plane
    schedule: every 30 seconds
  poll_scheduled_tasks:
    class: PollScheduledTasksJob
    queue: control_plane
    schedule: every minute
  poll_scheduled_chat_messages:
    class: PollScheduledChatMessagesJob
    queue: control_plane
    schedule: every minute
  retry_failed_chat_scoped_event_evaluators:
    class: ChatScopedEventRetryFailedJob
    queue: low_priority_maintenance
    schedule: every 5 minutes
  sync_enabled_forks:
    class: SyncEnabledForksJob
    queue: low_priority_maintenance
    schedule: every 15 minutes
  reap_stale_runs:
    class: ReapStaleRunsJob
    queue: control_plane
    schedule: every minute
  refresh_data_root_disk_usage:
    class: DataRootDiskUsageRefreshJob
    queue: cleanup
    schedule: every minute
  reap_classifier_pending:
    class: ReapClassifierPendingJob
    queue: low_priority_maintenance
    schedule: every 5 minutes
  reap_orphaned_spawned_processes:
    class: ReapOrphanedSpawnedProcessesJob
    queue: cleanup
    schedule: every minute
  reap_stale_instance_versions:
    class: ReapStaleInstanceVersionsJob
    queue: cleanup
    schedule: every minute
  sample_worker_host_health:
    class: WorkerHostHealthSampleJob
    queue: cleanup
    schedule: every minute
  check_worker_host_health_telemetry_gap:
    class: WorkerHostHealthTelemetryCheckJob
    queue: cleanup
    schedule: every 5 minutes
  prune_worker_host_health_samples:
    class: WorkerHostHealthSamplePruneJob
    queue: cleanup
    schedule: every day at 3:15am
  prune_run_resource_summaries:
    class: RunResourceSummaryPruneJob
    queue: cleanup
    schedule: every day at 3:18am
  refresh_workflow_step_resource_profiles:
    class: WorkflowStepResourceProfileRefreshJob
    queue: low_priority_maintenance
    schedule: every hour
  reap_stale_branches:
    class: ReapStaleBranchesJob
    queue: cleanup
    schedule: every day at 3:40am
  prune_spawned_processes:
    class: SpawnedProcessPruneJob
    queue: cleanup
    schedule: every day at 3:20am
  prune_provider_sessions:
    class: ProviderSessionPruneJob
    queue: cleanup
    schedule: every day at 3:00am
  prune_run_diagnostics:
    class: RunDiagnosticPruneJob
    queue: cleanup
    schedule: every day at 3:10am
  prune_work_engine_reconciler_activity:
    class: WorkEngineReconcilerActivityPruneJob
    queue: cleanup
    schedule: every day at 3:12am
  prune_old_notifications:
    class: PruneOldNotificationsJob
    queue: cleanup
    schedule: every day at 3:30am
  prune_workflow_workspaces:
    class: WorkflowWorkspacePruneJob
    queue: cleanup
    schedule: every 2 hours
  prune_video_walkthroughs:
    class: VideoWalkthroughPruneJob
    queue: cleanup
    schedule: every day at 3:40am
  prune_coverage_hit_map_ttl:
    class: CoverageHitMapTtlPruneJob
    queue: cleanup
    schedule: every day at 3:50am
  purge_expired_passkey_challenges:
    class: PurgeExpiredPasskeyChallengesJob
    queue: cleanup
    schedule: every day at 3:45am
  insight_sweep:
    class: InsightSweepJob
    queue: low_priority_maintenance
    schedule: every 6 hours
  sync_agent_skills:
    class: SyncAgentSkillsJob
    queue: low_priority_maintenance
    schedule: every hour
  sync_installations:
    class: SyncInstallationsJob
    queue: polling
    schedule: every 5 minutes
  reconcile_job_states:
    class: ReconcileJobStatesJob
    queue: control_plane
    schedule: every 5 minutes

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    class: SolidQueueCleanupJob
    queue: cleanup
    schedule: every hour at minute 12
