# Legacy core constants referenced by built-in plugins.
# New entries are forbidden; add a public facade under Syrus::Host instead.
# Chat internals still listed below (ChatSession, ChatMessage, ChatPendingAction,
# ChatSession::CrossChatMessage, ChatSession::EFFORT_LEVELS, ChatSessionLifecycle,
# ChatSessions::Creator, ChatBridgeThread, ChatQueuedMessage*, ChatTurnJob,
# Mentionable, Mentionables::Resolver) are deliberately not promoted: chat is
# planned to become a plugin, so the chat extraction decides their seams.
# Every entry left is a chat internal: chat is the one subsystem whose seams the
# planned chat extraction will decide, so the tier is retired when that lands.
---
legacy_baseline: 15
constants:
- name: ChatBridgeThread
- name: ChatMessage
- name: ChatPendingAction
- name: ChatPendingAction::NONTERMINAL_CHECKPOINT_STATES
- name: ChatQueuedMessage::INTERNAL_ROLE_KEY
- name: ChatQueuedMessagePromoter
- name: ChatSession
- name: ChatSession::CrossChatMessage
- name: ChatSession::CrossChatMessage::ClosedThreadError
- name: ChatSession::EFFORT_LEVELS
- name: ChatSessionLifecycle
- name: ChatSessions::Creator
- name: ChatTurnJob
- name: Mentionable
- name: Mentionables::Resolver
