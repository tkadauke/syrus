# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # Mailer content — subject uses Rails auto-lookup (<mailer_name>.<action>.subject)
  # view body content uses ERB lazy-lookup (same scope as subject)
  passwords_mailer:
    reset:
      subject: "Reset your password"
      intro: "You can reset your password on"
      link_text: "this password reset page"
      expires: "This link will expire in %{time}."

  invitation_mailer:
    invite:
      subject: "You're invited to Syrus"
      invited: "%{inviter} invited you to join Syrus."
      accept_intro: "Accept the invitation on"
      accept_link: "this signup page"
      expires: "This invitation expires on %{date}."

  # Web controller flash messages
  sessions:
    rate_limited: "Try again later."
    invalid_credentials: "Try another email address or password."

  passwords:
    rate_limited: "Try again later."
    reset_sent: "Password reset instructions sent (if user with that email address exists)."
    reset_success: "Password has been reset."
    mismatch: "Passwords did not match."
    token_invalid: "Password reset link is invalid or has expired."

