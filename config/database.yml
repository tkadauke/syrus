# Development and test use SQLite for zero-setup local work.
# Production uses MySQL (the deploy-target stack — see ROADMAP).
#
# Install drivers:
#   gem install sqlite3   # already pinned in Gemfile (default group)
#   gem install mysql2    # already pinned in Gemfile (:production group)

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 10 } } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate
  search:
    <<: *default
    database: <%= ENV.fetch("SEARCH_DATABASE_PATH", File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3")) %>
    migrations_paths: db/search_migrate
    schema_dump: false

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/test<%= ENV["TEST_ENV_NUMBER"] %>.sqlite3
  search:
    <<: *default
    database: <%= ENV.fetch("SEARCH_DATABASE_PATH", "storage/test_search#{ENV["TEST_ENV_NUMBER"]}.sqlite3") %>
    migrations_paths: db/search_migrate
    schema_dump: false
    database_tasks: false

# Connection URLs / env-driven config can override these — see
# https://guides.rubyonrails.org/configuring.html#configuring-a-database
<% if ENV["SYRUS_SQLITE"].present? %>
# Single-host "local mode" (Docker Compose on a laptop): production boot, but
# the four databases are SQLite files under SYRUS_DATA_ROOT/db — no MySQL.
<% data_root = ENV.fetch("SYRUS_DATA_ROOT", "/home/rails/.syrus") %>
production:
  primary: &primary_production_sqlite
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
    timeout: 5000
    database: <%= data_root %>/db/production.sqlite3
  cache:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  search:
    <<: *primary_production_sqlite
    database: <%= ENV.fetch("SEARCH_DATABASE_PATH", File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3")) %>
    migrations_paths: db/search_migrate
    schema_dump: false
<% else %>
production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    # DB_POOL intentionally decouples Active Record connection pools from
    # RAILS_MAX_THREADS. Multi-process Solid Queue workers each create their own
    # primary/cache/queue/cable pools, so tying every pool to a generic thread
    # count can reserve far more idle MySQL sessions than the server allows.
    pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 10 } } %>
    host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
    database: syrus_production
    username: syrus
    password: <%= ENV["SYRUS_DATABASE_PASSWORD"] %>
    # MySQL's default innodb_lock_wait_timeout is 50s — far too long
    # for a Rails request or recurring poll. A single contended row
    # would hold a connection from the pool for 50s, and three or
    # four of those in flight will exhaust the pool and cascade into
    # ConnectionTimeoutError for every other thread. The deploy on
    # 2026-05-17 saw exactly that failure mode (LandingQueueProcessorJob
    # enqueue → 50s lock-wait → all SolidQueue threads starved →
    # workers stopped heartbeating → 3 RunJobs orphaned). 10s is the
    # ceiling.
    variables:
      innodb_lock_wait_timeout: 10
  cache:
    <<: *primary_production
    database: syrus_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: syrus_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: syrus_production_cable
    migrations_paths: db/cable_migrate
  search:
    adapter: sqlite3
    pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 10 } } %>
    timeout: 5000
    database: <%= ENV.fetch("SEARCH_DATABASE_PATH", File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3")) %>
    migrations_paths: db/search_migrate
    schema_dump: false
<% end %>
