# Development and test use SQLite for zero-setup local work.
# Production uses MySQL (the deploy-target stack — see ROADMAP).
#
# Install drivers:
#   gem install sqlite3   # already pinned in Gemfile (default group)
#   gem install mysql2    # already pinned in Gemfile (:production group)

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Eval-only container image used by `bin/syrus dev`.
# It runs synchronously against a bind-mounted local checkout and has no
# production service dependencies.
eval:
  <<: *default
  database: storage/eval.sqlite3

# Connection URLs / env-driven config can override these — see
# https://guides.rubyonrails.org/configuring.html#configuring-a-database
production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
    database: syrus_production
    username: syrus
    password: <%= ENV["SYRUS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: syrus_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: syrus_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: syrus_production_cable
    migrations_paths: db/cable_migrate
