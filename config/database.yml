# Development and test use SQLite for zero-setup local work.
# Production uses MySQL (the deploy-target stack — see ROADMAP).
#
# Install drivers:
#   gem install sqlite3   # already pinned in Gemfile (default group)
#   gem install mysql2    # already pinned in Gemfile (:production group)

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 10 } } %>
  timeout: 5000

# The E2E suite runs the app in the development *environment* (it needs the
# dev-mode asset pipeline), but it must not run against the developer's own
# data. SYRUS_DEV_DB_PREFIX lets `bin/test-e2e` point the whole development
# database set at its own throwaway files, which it deletes before every run.
# Unset -- the normal case -- this is exactly the old `storage/development*`.
<% dev_db = ENV.fetch("SYRUS_DEV_DB_PREFIX", "development") %>
development:
  primary:
    <<: *default
    database: storage/<%= dev_db %>.sqlite3
  cache:
    <<: *default
    database: storage/<%= dev_db %>_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/<%= dev_db %>_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/<%= dev_db %>_cable.sqlite3
    migrations_paths: db/cable_migrate
  search:
    <<: *default
    database: <%= ENV["SEARCH_DATABASE_PATH"].to_s.empty? ? File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3") : ENV["SEARCH_DATABASE_PATH"] %>
    migrations_paths: db/search_migrate
    schema_dump: false

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# SYRUS_TEST_DB_NAMESPACE keeps graders that share one checkout apart.
# TEST_ENV_NUMBER alone cannot: parallel_tests overwrites it for each worker
# process with "", "2", "3", ..., so two parallel RSpec graders in the same
# checkout would both open storage/test.sqlite3 and lock each other out.
<% test_db_suffix = [ ENV["SYRUS_TEST_DB_NAMESPACE"], ENV["TEST_ENV_NUMBER"] ].reject { |part| part.to_s.empty? }.uniq.join("-") %>
test:
  primary:
    <<: *default
    database: storage/test<%= test_db_suffix %>.sqlite3
  search:
    <<: *default
    database: <%= ENV["SEARCH_DATABASE_PATH"].to_s.empty? ? "storage/test_search#{test_db_suffix}.sqlite3" : ENV["SEARCH_DATABASE_PATH"] %>
    migrations_paths: db/search_migrate
    schema_dump: false
    database_tasks: false

# Connection URLs / env-driven config can override these — see
# https://guides.rubyonrails.org/configuring.html#configuring-a-database
<% if ENV["SYRUS_SQLITE"].present? %>
# Single-host "local mode" (Docker Compose on a laptop): production boot, but
# the four databases are SQLite files under SYRUS_DATA_ROOT/db — no MySQL.
<% data_root = ENV.fetch("SYRUS_DATA_ROOT", "/home/rails/.syrus") %>
production:
  primary: &primary_production_sqlite
    adapter: sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
    timeout: 5000
    database: <%= data_root %>/db/production.sqlite3
  cache:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production_sqlite
    database: <%= data_root %>/db/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  search:
    <<: *primary_production_sqlite
    database: <%= ENV["SEARCH_DATABASE_PATH"].to_s.empty? ? File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3") : ENV["SEARCH_DATABASE_PATH"] %>
    migrations_paths: db/search_migrate
    schema_dump: false
<% else %>
production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    # DB_POOL intentionally decouples Active Record connection pools from
    # RAILS_MAX_THREADS. Multi-process Solid Queue workers each create their own
    # primary/cache/queue/cable pools, so tying every pool to a generic thread
    # count can reserve far more idle MySQL sessions than the server allows.
    # The busiest supported Solid Queue process has six threads. Solid Queue's own
    # heartbeat/supervision holds about two more, plus one spare so a single
    # dead connection does not take a worker down -- the budget
    # bin/check-thread-budget enforces -- still far fewer idle sessions than
    # the ten per process every queue process and worker pod used to reserve.
    # A compute pod's run worker claims RunProcessParallelism.host_capacity
    # Runs at once (queue.compute.yml), which grows with the pod's CPU limit:
    # a 16-CPU pod runs 12 Run threads against a pool of 9 and every thread
    # past the ninth timed out. Without an explicit DB_POOL the pool therefore
    # also covers one thread per visible CPU (an upper bound on that figure)
    # plus the overhead -- or the explicit JOB_CONCURRENCY or
    # SYRUS_WORKER_CPU_LIMIT, which may exceed it. Pools open connections
    # lazily, so the larger cap costs nothing in processes that run fewer
    # threads.
    <% require "etc" %>
    <% run_threads_bound = [ Etc.nprocessors, ENV["SYRUS_WORKER_CPU_LIMIT"].to_f.ceil, ENV["JOB_CONCURRENCY"].to_i ].max %>
    pool: <%= ENV.fetch("DB_POOL") { [ 9, run_threads_bound + 3 ].max } %>
    # Pools grow lazily but keep what they open: at Rails' default 300s idle
    # timeout, every burst left its connections parked, and the fleet's idle
    # connections across primary/queue/cache/cable reached MySQL's
    # max_connections ("Too many connections" failed graders and enqueues).
    # Return idle connections after a minute instead.
    idle_timeout: <%= ENV.fetch("DB_IDLE_TIMEOUT", 60).to_i %>
    reaping_frequency: <%= ENV.fetch("DB_REAPING_FREQUENCY", 20).to_i %>
    host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
    database: syrus_production
    username: syrus
    password: <%= ENV["SYRUS_DATABASE_PASSWORD"] %>
    # MySQL's default innodb_lock_wait_timeout is 50s — far too long
    # for a Rails request or recurring poll. A single contended row
    # would hold a connection from the pool for 50s, and three or
    # four of those in flight will exhaust the pool and cascade into
    # ConnectionTimeoutError for every other thread. The deploy on
    # 2026-05-17 saw exactly that failure mode (LandingQueueProcessorJob
    # enqueue → 50s lock-wait → all SolidQueue threads starved →
    # workers stopped heartbeating → 3 RunJobs orphaned). 10s is the
    # ceiling.
    # Active Record writes timestamps from Ruby in UTC, but `insert_all` /
    # `upsert_all` do not: they emit CURRENT_TIMESTAMP(6) as literal SQL, which
    # MySQL evaluates in the *session* time zone. With time_zone left at SYSTEM
    # the database container's local zone wins, so bulk-inserted rows land
    # hours away from everything written through Ruby. Production showed
    # solid_queue_claimed_executions.created_at exactly 4h behind
    # UTC_TIMESTAMP() while runs/solid_queue_jobs were correct, and Syrus's own
    # ChatMessage.insert_all! and Observability::EventStream writes take the
    # same path. Pin every session to UTC so both paths agree.
    #
    # READ COMMITTED (NY45): under MySQL's default REPEATABLE READ every plain
    # read in a transaction answers from the snapshot fixed by its first read.
    # Lineage.lock! makes plain reads to find a record's ancestry before it
    # waits on the row locks, so a check made after the lock could miss a
    # transaction that committed while this one waited: one grader fan-out
    # Run executed twice that way. READ COMMITTED gives every statement the
    # latest committed rows, and takes fewer gap locks. Needs row-based binary
    # logging, MySQL 8's default.
    variables:
      innodb_lock_wait_timeout: 10
      time_zone: "+00:00"
      transaction_isolation: "READ-COMMITTED"
    # Socket timeouts, off unless set. A worker that reaches MySQL through a
    # tunnel (the macOS worker's `kubectl port-forward`) can be left holding a
    # connection whose far end is gone without the local socket ever being
    # reset; with no read timeout the next query -- Rails' own checkout ping
    # included -- waits forever. bin/macos-worker sets these; cluster pods
    # talk to MySQL directly and keep the driver defaults.
<% if ENV["DB_CONNECT_TIMEOUT"].to_s != "" %>
    connect_timeout: <%= ENV["DB_CONNECT_TIMEOUT"].to_i %>
<% end %>
<% if ENV["DB_READ_TIMEOUT"].to_s != "" %>
    read_timeout: <%= ENV["DB_READ_TIMEOUT"].to_i %>
<% end %>
<% if ENV["DB_WRITE_TIMEOUT"].to_s != "" %>
    write_timeout: <%= ENV["DB_WRITE_TIMEOUT"].to_i %>
<% end %>
  cache:
    <<: *primary_production
    database: syrus_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: syrus_production_queue
    migrations_paths: db/queue_migrate
    # SolidQueue's fan-out jobs (PollAllMainBranchHealthJob, PollAllDeploymentStagesJob,
    # PollAllMergeStatesJob, PollAllPullRequestsJob, ...) bulk-enqueue many child jobs at
    # once. Under MySQL's default REPEATABLE READ, concurrent INSERTs into the same table
    # take gap locks on adjacent index ranges, and overlapping fan-outs running at the same
    # time can deadlock on solid_queue_jobs. READ COMMITTED drops those gap locks, which is
    # the standard recommendation for running SolidQueue on MySQL.
    variables:
      innodb_lock_wait_timeout: 10
      time_zone: "+00:00"
      transaction_isolation: "READ-COMMITTED"
  cable:
    <<: *primary_production
    database: syrus_production_cable
    migrations_paths: db/cable_migrate
    # Solid Cable polling also does concurrent writes into a shared table; same gap-lock
    # deadlock risk as the queue database above.
    variables:
      innodb_lock_wait_timeout: 10
      time_zone: "+00:00"
      transaction_isolation: "READ-COMMITTED"
  search:
    adapter: sqlite3
    pool: <%= ENV.fetch("DB_POOL", 9) %>
    timeout: 5000
    database: <%= ENV["SEARCH_DATABASE_PATH"].to_s.empty? ? File.join(ENV.fetch("SYRUS_DATA_ROOT", File.expand_path("~/.syrus")), "search.sqlite3") : ENV["SEARCH_DATABASE_PATH"] %>
    migrations_paths: db/search_migrate
    schema_dump: false
<% end %>
