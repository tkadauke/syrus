groups:
  - name: syrus.core
    rules:
      - alert: SyrusQueueOldestAgeHigh
        expr: max by (queue) (syrus_global_queue_oldest_age_seconds) > 1800
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Syrus queue {{ $labels.queue }} has work older than 30 minutes"
          description: "The oldest ready execution on queue {{ $labels.queue }} has been waiting for more than 30 minutes."

      - alert: SyrusProviderCircuitOpen
        expr: max by (provider) (syrus_provider_circuit_state) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Syrus provider circuit is open for {{ $labels.provider }}"
          description: "Syrus is deferring work because the {{ $labels.provider }} provider circuit is open."

      - alert: SyrusRecurringJobStale
        expr: |
          syrus_recurring_job_last_success_seconds{job="process_landing_queue"} > 60
          or syrus_recurring_job_last_success_seconds{job=~"plugin_ticks|deliver_pending_action_outcomes|reap_stalled_pending_actions|poll_scheduled_chat_messages|flush_observability_events|sample_global_metrics|deliver_system_alerts|reap_stale_runs|refresh_data_root_disk_usage|reap_orphaned_spawned_processes|reap_stale_instance_versions|sample_worker_host_health"} > 120
          or syrus_recurring_job_last_success_seconds{job=~"poll_repositories|poll_input_sources|poll_pull_requests|poll_external_open_prs|poll_merge_states|poll_hotfix_syncs|poll_deployment_stages|sync_github_permissions|watch_platform_connectors|discover_maintenance_tasks|refresh_connected_accounts|retry_failed_chat_scoped_event_evaluators|check_worker_host_health_telemetry_gap|check_polling_queue_coverage"} > 600
          or syrus_recurring_job_last_success_seconds{job=~"prune_auto_retry_attempts|database_retention_sweep"} > 1200
          or syrus_recurring_job_last_success_seconds{job="sync_enabled_forks"} > 1800
          or syrus_recurring_job_last_success_seconds{job=~"refresh_workflow_step_resource_profiles|refresh_retention_size_snapshot"} > 7200
          or syrus_recurring_job_last_success_seconds{job="prune_workflow_workspaces"} > 14400
          or syrus_recurring_job_last_success_seconds{job="refresh_cognitive_debt_snapshots"} > 28800
          or syrus_recurring_job_last_success_seconds{job=~"prune_ui_engagement_samples|prune_branch_publications|database_retention_archive_sweep|reap_stale_branches|reconcile_integration_branches|purge_expired_passkey_challenges"} > 172800
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Syrus recurring job {{ $labels.job }} is stale"
          description: "Recurring job {{ $labels.job }} has not completed successfully within the expected window."

  # Coworker thresholds are intentionally literal here so operators can tune
  # them in one deployed rules file. Spend defaults to a 3x anomaly and a
  # $100/day absolute cap.
  - name: syrus.coworkers
    rules:
      - alert: SyrusCoworkerJournalingStale
        expr: syrus_coworkers_journaling_last_result_age_seconds > 129600 unless on (coworker) (syrus_coworkers_journaling_state{state="paused"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Coworker {{ $labels.coworker }} journaling is stale"
          description: "No journaled or dormant-skipped result has been recorded for 36 hours."

      - alert: SyrusCoworkerJournalingStaleCritical
        expr: syrus_coworkers_journaling_last_result_age_seconds > 259200 unless on (coworker) (syrus_coworkers_journaling_state{state="paused"} == 1)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Coworker {{ $labels.coworker }} journaling is critically stale"
          description: "No journaled or dormant-skipped result has been recorded for 72 hours."

      - alert: SyrusCoworkerJournalingFailed
        expr: syrus_coworkers_journaling_consecutive_failures >= 3 and on (coworker) (syrus_coworkers_journaling_state{state="auto_paused"} == 1 or syrus_coworkers_journaling_last_result{result="failed"} == 1)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Coworker {{ $labels.coworker }} journaling repeatedly failed"
          description: "Journaling is auto-paused or last failed after at least three consecutive failures."

      - alert: SyrusCoworkerUnsavedWorkspace
        expr: syrus_coworkers_unsaved_workspace_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Coworker {{ $labels.coworker }} has an unsaved workspace"
          description: "Workspace changes have remained unsaved for more than one hour."

      - alert: SyrusCoworkerUnsavedWorkspaceCritical
        expr: syrus_coworkers_unsaved_workspace_age_seconds > 21600
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Coworker {{ $labels.coworker }} has a critically stale unsaved workspace"
          description: "Workspace changes have remained unsaved for more than six hours."

      - alert: SyrusCoworkerWorkspacePushFailures
        expr: sum by (coworker) (rate(syrus_coworkers_workspace_push_failures_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Coworker {{ $labels.coworker }} workspace pushes keep failing"
          description: "Workspace push failures have continued for 30 minutes."

      - alert: SyrusCoworkerSpendAnomaly
        expr: sum by (coworker) (increase(syrus_coworkers_spend_usd_total[24h])) > 3 * (sum by (coworker) (increase(syrus_coworkers_spend_usd_total[7d] offset 1d)) / 7)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Coworker {{ $labels.coworker }} daily spend is anomalous"
          description: "The last 24 hours exceed three times the trailing seven-day daily average."

      - alert: SyrusCoworkerDailySpendCap
        expr: sum by (coworker) (increase(syrus_coworkers_spend_usd_total[24h])) > 100
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Coworker {{ $labels.coworker }} exceeded the daily spend cap"
          description: "The last 24 hours exceeded the configured default cap of $100."
