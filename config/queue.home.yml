<%# "Home" worker config for a multi-node k3s deployment. Selected per pod with
    SOLID_QUEUE_CONFIG=config/queue.home.yml. Do NOT point single-host / Compose
    deployments at this file — they use the full config/queue.yml so one worker
    covers every queue. This split only makes sense when a SEPARATE compute
    worker (config/queue.compute.yml) consumes `runs` + `merges` elsewhere.

    The home worker runs the queues that are bound to the single-node search
    index (SQLite FTS5, an RWO PVC) or that must stay co-located with the web
    pods and the search volume:
      - `control_plane` — schedulers, landing admission, reconciliation,
                          retries, and chat wakeups.
      - `polling`       — GitHub/repository/main-branch/deployment pollers.
      - `indexing`      — search index writes and issue-image ingestion.
      - `cleanup`       — pruning and filesystem/data-root cleanup.
      - `low_priority_maintenance` — enrichment, sync, and insight sweeps.
      - `chat`     — ChatTurnJob / chat workspace maintenance (search READS via
                     the search_chats MCP tool).
      - `videos`   — walkthrough-video analysis (local disk + Active Storage).
    Heavy agent compute (`runs`) and landing (`merges`) live on the compute
    tier, which never touches the search index and can spread across nodes.

    Because this worker consumes `default`, it is also the tier that SCHEDULES
    recurring tasks — leave SOLID_QUEUE_SKIP_RECURRING unset here and set it to
    `1` on compute pods so recurring jobs are scheduled exactly once.

    `Socket` isn't autoloaded when this file is rendered outside Rails
    (bin/check-thread-budget); require it so the ERB is self-contained. %>
<% require "socket" %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Control-plane pool. Listed first with this pod's per-pod
    # `resume-<hostname>` queue so an operator resume that landed here is picked
    # up ahead of routine background work.
    # Multi-queue workers MUST be a YAML array: Solid Queue 1.4 does NOT split a
    # space-joined string (`Array("resume-x control_plane")` is one literal queue), so
    # a string here would claim zero jobs and back up the recurring scheduler.
    - queues:
        - "resume-<%= Socket.gethostname %>"
        - "control_plane"
      threads: <%= ENV.fetch("CONTROL_PLANE_CONCURRENCY", 3) %>
      processes: 1
      polling_interval: 0.1
    # Bulk polling is bursty and GitHub/API-bound; keep it off control-plane
    # threads so scheduling, landing, and reconciliation keep moving.
    - queues: "polling"
      threads: <%= ENV.fetch("POLLING_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.2
    # Search writes stay on the home node with the search volume.
    - queues: "indexing"
      threads: <%= ENV.fetch("INDEXING_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.2
    # Cleanup/pruning can be IO-heavy; keep a narrow lane for it.
    - queues: "cleanup"
      threads: <%= ENV.fetch("CLEANUP_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    # Non-urgent enrichment and maintenance runs last.
    - queues: "low_priority_maintenance"
      threads: <%= ENV.fetch("LOW_PRIORITY_MAINTENANCE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 1
    # User-facing chat turns + chat workspace maintenance. Kept off the shared
    # pool so an app-event broadcast storm can't delay a chat reply, and vice
    # versa. Reads the search index via the search_chats MCP tool.
    - queues: "chat"
      threads: <%= ENV.fetch("CHAT_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.1
    # Walkthrough-video analysis pins a thread for many minutes (streamed Gemini
    # upload + ACTIVE polling + a long generateContent). Isolated so a few
    # simultaneous analyses can't starve pollers or broadcasts.
    - queues: "videos"
      threads: <%= ENV.fetch("VIDEO_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
