<%# `Socket` (used below for the per-worker resume queue) isn't autoloaded when
    this file is rendered outside Rails — e.g. bin/check-thread-budget. Require
    it here so the ERB is self-contained everywhere. %>
<% require "socket" %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Long-running RunJobs (agent invocations, ~5-10 min each)
    # get their own worker so they can't starve maintenance and
    # broadcast work. JOB_CONCURRENCY caps the simultaneous agent
    # invocations per pod (a global cap lives in
    # AppSetting.max_concurrent_agent_runs). This worker ALSO consumes its
    # own per-pod `resume-<hostname>` queue — "Retry from failed step" and
    # post-crash re-enqueues are routed there so they land on the pod holding
    # the Job's local workspace (see Run#resume_worker_queue). Listed first so
    # operator-initiated resumes are picked up ahead of fresh work.
    # NOTE: multi-queue workers MUST use a YAML array. Solid Queue 1.4 does
    # NOT split a space- or comma-separated string — `Array("resume-x runs")`
    # is one literal queue name, so a space-joined string silently claims zero
    # jobs (SolidQueue::Worker#initialize: `Array(options[:queues])`).
    - queues:
        - "resume-<%= Socket.gethostname %>"
        - "runs"
      threads: <%= ENV.fetch("JOB_CONCURRENCY", 3) %>
      processes: 1
      polling_interval: 0.1
    # Deterministic landing and merge work runs outside the agent
    # pool so quick non-agentic steps do not consume Claude slots.
    - queues: "merges"
      threads: <%= ENV.fetch("MERGE_CONCURRENCY", 5) %>
      processes: 1
      polling_interval: 0.1
    # User-facing chat turns and chat workspace maintenance get a
    # separate low-concurrency pool. They may invoke agents too, but
    # must not sit behind saturated multi-hour RunJobs.
    - queues: "chat"
      threads: <%= ENV.fetch("CHAT_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.1
    # Walkthrough-video analysis pins a thread for many minutes
    # (500MB streamed Gemini upload + ACTIVE polling + a long
    # generateContent). Isolated so a few simultaneous analyses
    # can't starve pollers, reapers, or app-event broadcasts.
    - queues: "videos"
      threads: <%= ENV.fetch("VIDEO_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.5
    # Latency-sensitive control-plane work: recurring schedulers, landing
    # admission, stale-run reconciliation, retry dispatch, and chat wakeups.
    # Keep this queue isolated from bulk poll/index/prune backlogs.
    - queues: "control_plane"
      threads: <%= ENV.fetch("CONTROL_PLANE_CONCURRENCY", 3) %>
      processes: 1
      polling_interval: 0.1
    # External polling fans out into per-repository / per-PR checks. These jobs
    # can burst when many repositories are active, so they do not share threads
    # with the scheduler/control-plane queue.
    - queues: "polling"
      threads: <%= ENV.fetch("POLLING_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.2
    # Search index writes are bound to the home/search node in multi-node
    # deployments. Keep them separate from pollers and control-plane decisions.
    - queues: "indexing"
      threads: <%= ENV.fetch("INDEXING_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.2
    # Cleanup/pruning can be bulky and IO-heavy. It gets a small pool so it
    # keeps making progress without delaying scheduling or indexing.
    - queues: "cleanup"
      threads: <%= ENV.fetch("CLEANUP_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    # Low-priority maintenance and enrichment: title generation, insight sweeps,
    # fork sync, resource profile refreshes, and other non-urgent background
    # work. This is deliberately last and slowest.
    - queues: "low_priority_maintenance"
      threads: <%= ENV.fetch("LOW_PRIORITY_MAINTENANCE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 1

development:
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    # SQLite has a single writer. Keep the production queue separation,
    # but avoid the high local thread fanout that can wedge the dev queue DB.
    # Multi-queue workers MUST be a YAML array (Solid Queue 1.4 doesn't split
    # a space-joined string — see the note in the default section above).
    - queues:
        - "resume-<%= Socket.gethostname %>"
        - "runs"
      threads: <%= ENV.fetch("DEV_RUN_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "merges"
      threads: <%= ENV.fetch("DEV_MERGE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "chat"
      threads: <%= ENV.fetch("DEV_CHAT_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "videos"
      threads: <%= ENV.fetch("DEV_VIDEO_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "control_plane"
      threads: <%= ENV.fetch("DEV_CONTROL_PLANE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "polling"
      threads: <%= ENV.fetch("DEV_POLLING_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "indexing"
      threads: <%= ENV.fetch("DEV_INDEXING_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "cleanup"
      threads: <%= ENV.fetch("DEV_CLEANUP_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "low_priority_maintenance"
      threads: <%= ENV.fetch("DEV_LOW_PRIORITY_MAINTENANCE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5

test:
  <<: *default

production:
  <<: *default
