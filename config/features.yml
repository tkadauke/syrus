features:
  - slug: terminal
    category: "Labs"
    name: "Terminal"
    name_i18n_key: "features.slugs.terminal.name"
    description: "Enables the interactive terminal experience."
    description_i18n_key: "features.slugs.terminal.description"
    default: false
  - slug: video_walkthroughs
    category: "Labs"
    name: "Walkthrough videos"
    name_i18n_key: "features.slugs.video_walkthroughs.name"
    description: "Record or drag a narrated screen recording into a chat; Gemini analyzes it and the chat agent works it toward an Epic. Requires a Gemini API key."
    description_i18n_key: "features.slugs.video_walkthroughs.description"
    default: false
  - slug: chat_speech_to_text
    category: "Labs"
    name: "Chat speech-to-text"
    name_i18n_key: "features.slugs.chat_speech_to_text.name"
    description: "Enables microphone dictation in Syrus Chat with capability-based backend transcription and browser fallback."
    description_i18n_key: "features.slugs.chat_speech_to_text.description"
    default: false
  - slug: coding_mode
    category: "Labs"
    name: "Coding Mode"
    name_i18n_key: "features.slugs.coding_mode.name"
    description: "Enables Coding Mode for Syrus Chat, allowing the agent to implement code changes directly in the session checkout instead of just planning."
    description_i18n_key: "features.slugs.coding_mode.description"
    default: false
  - slug: performance_logging
    category: "Operations"
    name: "Performance logging"
    name_i18n_key: "features.slugs.performance_logging.name"
    description: "Records structured slow request, SQL, and phase events to logs and a short-lived admin diagnostics buffer."
    description_i18n_key: "features.slugs.performance_logging.description"
    default: false
  - slug: operational_log_indexing
    category: "Operations"
    name: "Operational log indexing"
    name_i18n_key: "features.slugs.operational_log_indexing.name"
    description: "Indexes short-lived structured Rails application log events for Syrus implementation agents working on Syrus itself."
    description_i18n_key: "features.slugs.operational_log_indexing.description"
    default: false
  - slug: browser_error_auto_reports
    category: "Operations"
    name: "Browser error auto reports"
    name_i18n_key: "features.slugs.browser_error_auto_reports.name"
    description: "Automatically files one bug-report job per browser-error fingerprint and app revision."
    description_i18n_key: "features.slugs.browser_error_auto_reports.description"
    default: false
  - slug: local_mode
    category: "Labs"
    name: "Local Mode"
    name_i18n_key: "features.slugs.local_mode.name"
    description: "Enables the Local chat mode and the `syrus local` daemon command. The agent connects to a daemon running on the user's local machine via a reverse WebSocket tunnel to read/write files and run commands locally."
    description_i18n_key: "features.slugs.local_mode.description"
    default: false
  - slug: agent_insights
    category: "Labs"
    name: "Agent Insights"
    name_i18n_key: "features.slugs.agent_insights.name"
    description: "Enables agent insight analysis jobs that inspect recent workflow runs and surface improvement suggestions."
    description_i18n_key: "features.slugs.agent_insights.description"
    default: false
  - slug: admin_supervisor_chat
    category: "Operations"
    name: "Admin supervisor chat"
    name_i18n_key: "features.slugs.admin_supervisor_chat.name"
    description: "Enables one durable pinned Supervisor chat per admin user."
    description_i18n_key: "features.slugs.admin_supervisor_chat.description"
    default: false
  - slug: chat_context_compaction
    category: "Operations"
    name: "Chat context compaction"
    name_i18n_key: "features.slugs.chat_context_compaction.name"
    description: "Compacts older provider replay context for long-running chats while preserving the full durable chat transcript."
    description_i18n_key: "features.slugs.chat_context_compaction.description"
    default: false
  - slug: landing_validation_prefetch
    category: "Operations"
    name: "Landing validation prefetch"
    name_i18n_key: "features.slugs.landing_validation_prefetch.name"
    description: "Speculatively runs landing graders for the next eligible same-repository Job after the current Job's landing graders pass. Actual merge remains serialized."
    description_i18n_key: "features.slugs.landing_validation_prefetch.description"
    default: false
  - slug: visual_review
    category: "Labs"
    name: "Visual review"
    name_i18n_key: "features.slugs.visual_review.name"
    description: "Enables the visual_review step: an independent agent drives a headless browser against the worker's own in-step preview to catch visible defects and capture screenshot artifacts before graders run. A repository's .syrus.yml can override this instance-wide default per repo."
    description_i18n_key: "features.slugs.visual_review.description"
    default: false
  - slug: epicless_job_bundling
    category: "Labs"
    name: "Epicless Job bundling"
    name_i18n_key: "features.slugs.epicless_job_bundling.name"
    description: "Enables landing multiple approved epicless Jobs together as one atomic bundle, the same way an Epic's children land together via the merge train. Experimental."
    description_i18n_key: "features.slugs.epicless_job_bundling.description"
    default: false
  - slug: persistent_mcp_sidecar
    category: "Labs"
    name: "Persistent MCP sidecar"
    name_i18n_key: "features.slugs.persistent_mcp_sidecar.name"
    description: "Enables a worker-local persistent MCP sidecar daemon that boots once and exposes a local-only MCP transport and health check. Chat turns can route their MCP tool calls to it, with automatic fallback to stdio; workflow agent runs do not yet use it and always fall back to the per-run stdio sidecar. When disabled, all agents keep using the default per-run/per-session stdio sidecars."
    description_i18n_key: "features.slugs.persistent_mcp_sidecar.description"
    default: false
  - slug: mysql_db_browser
    category: "Labs"
    name: "MySQL DB browser"
    name_i18n_key: "features.slugs.mysql_db_browser.name"
    description: "Enables the MySQL DB browser plugin, which lets admins register and use connections to external MySQL databases with real credentials."
    description_i18n_key: "features.slugs.mysql_db_browser.description"
    default: false
