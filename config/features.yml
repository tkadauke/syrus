features:
  - slug: v2_ui
    category: "UI Experiments"
    name: "V2 UI"
    description: "Enables the redesigned app shell. Introduced in PR #1185."
    default: false
  - slug: v2_sidebar_subject_selector
    category: "UI Experiments"
    name: "V2 Sidebar Subject Selector"
    description: "Moves the Epics/Jobs/Workflows selector from the dashboard header into the sidebar. Introduced in PR #1185."
    default: false
  - slug: terminal
    category: "Labs"
    name: "Terminal"
    description: "Enables the interactive terminal experience."
    default: false
  - slug: chat_polish
    category: "UI Experiments"
    name: "Chat polish"
    description: "Subtle chat animations: new messages fade in, the new-messages jump scrolls smoothly. Motion-safe (respects reduced-motion). Introduced in PR #1655."
    default: false
  - slug: video_walkthroughs
    category: "Labs"
    name: "Walkthrough videos"
    description: "Record or drag a narrated screen recording into a chat; Gemini analyzes it and the chat agent works it toward an Epic. Requires a Gemini API key. Introduced in PR #1627."
    default: false
  - slug: coding_mode
    category: "Labs"
    name: "Coding Mode"
    description: "Enables Coding Mode for Syrus Chat, allowing the agent to implement code changes directly in the session checkout instead of just planning. Introduced in PR #1554."
    default: false
  - slug: performance_logging
    category: "Operations"
    name: "Performance logging"
    description: "Records structured slow request, SQL, and phase events to logs and a short-lived admin diagnostics buffer."
    default: false
  - slug: local_mode
    category: "Labs"
    name: "Local Mode"
    description: "Enables the Local chat mode, where the agent connects to a daemon running on the user's local machine via a reverse WebSocket tunnel."
    default: false
