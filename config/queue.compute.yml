<%# "Compute" worker config for a multi-node k3s deployment. Selected per pod
    with SOLID_QUEUE_CONFIG=config/queue.compute.yml. Do NOT point single-host /
    Compose deployments at this file — they use the full config/queue.yml so one
    worker covers every queue. This split only makes sense when a SEPARATE home
    worker (config/queue.home.yml) consumes the chat, video, control-plane,
    polling, indexing, cleanup, and low-priority maintenance queues.

    The compute worker runs the heavy, search-FREE queues so they can spread
    across worker nodes on local disk, away from the search/web node:
      - `runs`   — heavy workflow RunJobs (implement / respond / graders /
                   main_grader / ...), minutes each. Never touch the search
                   index (they enqueue Index*Job onto `indexing`, which the
                   home worker consumes).
      - `runs-<os>-<arch>` — capability-specific compute lanes such as
                   `runs-macos-arm64` and `runs-windows-amd64`.
      - `merges` — deterministic landing / rebase / stack-rebase Workflows.
      - `merges-<os>-<arch>` — capability-specific landing/validation lanes.
    Each pod also consumes its storage-affinity
    `resume-<worker-storage-key>` queue: a workspace lives on the data root
    that first ran it, so "Retry from failed step" and post-crash re-enqueues
    must resume on a worker that can see that same data root
    (Run#resume_worker_queue, Workflow.resume_queue_name). This affinity is
    load-bearing here — it is why the compute tier can use fast per-node local
    disk instead of a shared PVC, while shared-PVC deployments naturally share
    one resume queue.

    Set SOLID_QUEUE_SKIP_RECURRING=1 on compute pods: recurring tasks enqueue to
    home-tier queues, so only the home worker should schedule them.

    WorkerStorageIdentity and WorkerCapabilities are required explicitly so the
    ERB is self-contained when rendered by queue/config checks outside normal
    Rails autoload paths. %>
<% services_path = File.expand_path("app/services", Dir.pwd) %>
<% $LOAD_PATH.unshift(services_path) unless $LOAD_PATH.include?(services_path) %>
<% require "worker_storage_identity" %>
<% require "worker_capabilities" %>
<% run_queues = WorkerCapabilities.queue_names_for("runs") %>
<% merge_queues = WorkerCapabilities.queue_names_for("merges") %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Long-running workflow RunJobs. JOB_CONCURRENCY caps simultaneous runs PER
    # POD, so total concurrency across the cluster is JOB_CONCURRENCY ×
    # (compute pod count); a cluster-wide ceiling lives in
    # AppSetting.max_concurrent_agent_runs. Listed first with this pod's
    # `resume-<worker-storage-key>` queue so operator resumes land ahead of
    # fresh work.
    # Multi-queue workers MUST be a YAML array: Solid Queue 1.4 does NOT split a
    # space-joined string (`Array("resume-x runs")` is one literal queue), so a
    # string here would claim zero agent jobs.
    - queues:
<% ([WorkerStorageIdentity.queue_name] + run_queues).each do |queue_name| %>
        - "<%= queue_name %>"
<% end %>
      threads: <%= ENV.fetch("JOB_CONCURRENCY", 3) %>
      processes: 1
      polling_interval: 0.1
    # Deterministic landing / rebase work runs outside the agent pool so quick
    # non-agentic steps do not consume Claude slots.
    - queues:
<% merge_queues.each do |queue_name| %>
        - "<%= queue_name %>"
<% end %>
      threads: <%= ENV.fetch("MERGE_CONCURRENCY", 5) %>
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
