test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage for production. Points at the in-cluster
# MinIO that green_acres deploys (see apps/minio.py + apps/syrus.py).
# Env vars are injected by the Syrus pod spec — the syrus-minio Secret
# in the Syrus namespace holds the access key + secret. Bucket and
# endpoint come from the deployment (e.g. syrus-prod-attachments
# against http://minio.minio.svc.cluster.local:9000).
minio:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  force_path_style: true
