test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Single-host "local mode" (Docker Compose): on-disk attachments under the
# persisted SYRUS_DATA_ROOT volume, so uploads survive restarts without S3.
local_volume:
  service: Disk
  root: <%= File.join(ENV.fetch("SYRUS_DATA_ROOT", Rails.root.join("storage").to_s), "storage") %>

# S3-compatible object storage for production. Configure credentials,
# bucket, and endpoint through environment variables for your deployment.
# For example, S3_BUCKET=syrus-production-attachments and
# S3_ENDPOINT=http://your-minio-host.example.com:9000.
minio:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  force_path_style: true

# Dedicated storage for RetentionArchive attachments, independent of
# whichever service backs the app's primary attachments above. Lets an
# operator point archived (soon-to-be-pruned) rows at a large local disk
# volume regardless of where regular attachments live. Resolved via
# config.retention_archive_storage_service / RETENTION_ARCHIVE_STORAGE_SERVICE
# (see config/retention_archive_storage.rb); unset falls back to the primary
# active_storage.service, so this entry is only used when explicitly
# selected.
retention_archive_disk:
  service: Disk
  root: <%= ENV.fetch("RETENTION_ARCHIVE_ROOT", Rails.root.join("storage/retention_archives").to_s) %>

# S3-compatible object storage for retention archives, mirroring #minio
# above but configured independently so archives can live in a different
# bucket/endpoint than the app's primary attachments.
retention_archive_s3:
  service: S3
  access_key_id: <%= ENV["RETENTION_ARCHIVE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["RETENTION_ARCHIVE_S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("RETENTION_ARCHIVE_S3_REGION", "us-east-1") %>
  bucket: <%= ENV["RETENTION_ARCHIVE_S3_BUCKET"] %>
  endpoint: <%= ENV["RETENTION_ARCHIVE_S3_ENDPOINT"] %>
  force_path_style: true
