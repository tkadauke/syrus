# Single-host Syrus on a laptop: web + worker, SQLite, one named volume.
#
# By default this PULLS the prebuilt image from GHCR
# (ghcr.io/tkadauke/syrus-backend) — nothing to compile. Run it with `./install.sh`.
#
# Developers building from this checkout instead use `bin/compose-up`, which
# layers `docker-compose.build.yml` on top to build the image locally.
name: syrus

# Web, worker, and the one-shot setup task all share one image + config.
x-app: &app
  image: ${SYRUS_IMAGE:-ghcr.io/tkadauke/syrus-backend:latest}
  env_file: .env
  volumes:
    # Clone cache + the SQLite databases live here, persisted across restarts.
    - syrus-data:/home/rails/.syrus
  environment:
    SEARCH_DATABASE_PATH: /home/rails/.syrus-search/search.sqlite3
  restart: unless-stopped

services:
  # Runs once as root: make the data volume writable by the rails user (named
  # volumes mount root-owned), prepare the databases, then exit. web + worker
  # wait for this to finish.
  setup:
    <<: *app
    user: "0:0"
    # A single list element so Compose passes the whole script as one arg to
    # `bash -euc` (a string command would be word-split, leaving bash only the
    # first word). `$$` escapes Compose interpolation so bash expands the var.
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        mkdir -p "$$SYRUS_DATA_ROOT/db"
        mkdir -p "$$(dirname "$$SEARCH_DATABASE_PATH")"
        bin/rails db:prepare
        chown -R 1000:1000 "$$SYRUS_DATA_ROOT" "$$(dirname "$$SEARCH_DATABASE_PATH")"
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    restart: "no"

  web:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: web
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    ports:
      - "${SYRUS_PORT:-3000}:80"

  worker:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: worker
      SYRUS_TERMINAL_HOST: worker
      # Required for connectivity plugins (e.g. Tailscale) so the daemon can
      # forward traffic to the web container. Safe to remove if no connectivity
      # plugin is in use.
      SYRUS_INTERNAL_WEB_URL: http://web:80
    # Required for connectivity plugins (e.g. Tailscale) that manage network
    # interfaces and TUN devices. Safe to remove if no connectivity plugin is
    # in use.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
      - syrus-mise-cache:/opt/mise
    command: ["./bin/jobs"]

  preview:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: preview
      SYRUS_PREVIEW_INTERNAL_HOST: preview
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    command: ["./bin/preview"]

volumes:
  syrus-data:
  syrus-search:
  syrus-mise-cache:
