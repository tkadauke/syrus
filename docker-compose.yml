# Single-host Syrus on a laptop: web + worker, SQLite, one named volume.
#
# By default this PULLS the prebuilt image from GHCR
# (ghcr.io/tkadauke/syrus-backend) — nothing to compile. Run it with `./install.sh`.
#
# Developers building from this checkout instead use `bin/compose-up`, which
# layers `docker-compose.build.yml` on top to build the image locally.
name: syrus

# Web, worker, and the one-shot setup task all share one image + config.
x-app: &app
  image: ${SYRUS_IMAGE:-ghcr.io/tkadauke/syrus-backend:latest}
  env_file: .env
  volumes:
    # Clone cache + the SQLite databases live here, persisted across restarts.
    - syrus-data:/home/rails/.syrus
  environment:
    SEARCH_DATABASE_PATH: /home/rails/.syrus-search/search.sqlite3
  restart: unless-stopped

services:
  # Runs once as root: make the data volume writable by the rails user (named
  # volumes mount root-owned), prepare the databases, then exit. web + worker
  # wait for this to finish.
  setup:
    <<: *app
    user: "0:0"
    # A single list element so Compose passes the whole script as one arg to
    # `bash -euc` (a string command would be word-split, leaving bash only the
    # first word). `$$` escapes Compose interpolation so bash expands the var.
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        mkdir -p "$$SYRUS_DATA_ROOT/db"
        mkdir -p "$$(dirname "$$SEARCH_DATABASE_PATH")"
        bin/rails db:prepare
        chown -R 1000:1000 "$$SYRUS_DATA_ROOT" "$$(dirname "$$SEARCH_DATABASE_PATH")"
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    restart: "no"

  web:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: web
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    ports:
      - "${SYRUS_PORT:-3000}:80"

  worker:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: worker
      SYRUS_TERMINAL_HOST: worker
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
      - syrus-mise-cache:/opt/mise
    command: ["./bin/jobs"]

  preview:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      SYRUS_ROLE: preview
      SYRUS_PREVIEW_INTERNAL_HOST: preview
    volumes:
      - syrus-data:/home/rails/.syrus
      - syrus-search:/home/rails/.syrus-search
    command: ["./bin/preview"]

  # Plugin Runtime's manager: starts the service containers that
  # container-backed plugins (Git Mirror, ...) need when those plugins are
  # enabled, and removes them when they are disabled -- no restart. It is the
  # only container given the Docker socket, and it only runs images its policy
  # allows (see plugins/plugin_runtime/container). Idle until a plugin asks.
  # On shutdown it takes those containers down with it (their data volumes
  # stay), so `docker compose down` can remove the project network.
  #
  # It is also the only thing that can ever ask Docker to grant NET_ADMIN/
  # NET_RAW/the TUN device to a container it creates -- and only for one
  # compiled, first-party service (Tailscale), through its own privileged
  # lane (see docs/plans/tailscale-privileged-service-lane.md). This
  # container itself stays unprivileged; the worker never holds any of that
  # either.
  plugin-runtime:
    image: ${SYRUS_PLUGIN_RUNTIME_IMAGE:-ghcr.io/tkadauke/syrus-plugin-runtime:latest}
    environment:
      RUNTIME_MANAGER_TOKEN: ${SYRUS_PLUGIN_RUNTIME_TOKEN:-}
      # Used only when the Tailscale plugin is enabled: the fixed target its
      # container's `tailscale serve` forwards to, and an optional override
      # for the compiled image tag it runs. Harmless to leave set otherwise.
      SYRUS_INTERNAL_WEB_URL: http://web:80
      RUNTIME_MANAGER_TAILSCALE_IMAGE: ${SYRUS_TAILSCALE_IMAGE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  syrus-data:
  syrus-search:
  syrus-mise-cache:
